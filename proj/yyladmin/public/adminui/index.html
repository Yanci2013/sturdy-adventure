<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>砚世易游pro · 后台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --brand:#3b7cff; --brand-weak:#eef3ff; --brand-deep:#2f66d6;
  --text:#1f2430; --sub:#8a94a6; --line:#eef0f4; --bg:#f6f7fb;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ---------- 登录 ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f4ff,#f7f9fc)}
.login-card{width:380px;background:#fff;border-radius:16px;padding:40px 36px;box-shadow:0 12px 40px rgba(59,124,255,.12)}
.login-card .logo{width:52px;height:52px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;margin:0 auto 16px}
.login-card h1{font-size:20px;text-align:center;margin-bottom:4px}
.login-card p.tip{text-align:center;color:var(--sub);font-size:13px;margin-bottom:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:14px;outline:none;transition:.2s}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,124,255,.12)}
.btn{height:42px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;cursor:pointer;width:100%;transition:.2s}
.btn:hover{background:var(--brand-deep)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.login-err{color:#e5484d;font-size:13px;min-height:18px;margin-bottom:8px;text-align:center}

/* ---------- 布局 ---------- */
.layout{display:flex;min-height:100vh}
.sidebar{width:246px;background:#fff;border-right:1px solid var(--line);position:fixed;top:0;left:0;bottom:0;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.brand .name{font-weight:700;font-size:16px}
.brand .sub{font-size:11px;color:var(--sub)}
.side-search{padding:0 16px 12px}
.side-search input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font-size:13px;outline:none;background:#fafbfd}
.menu{flex:1;padding:4px 10px 24px}
.mgroup{margin-bottom:2px}
.mgroup-title{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--text);font-weight:600;font-size:14px}
.mgroup-title:hover{background:#f5f7fb}
.mgroup-title .ic{width:20px;height:20px;color:var(--sub);flex:none}
.mgroup.open>.mgroup-title{background:#f5f7fb}
.mgroup-title .arrow{margin-left:auto;color:var(--sub);transition:.2s;font-size:12px}
.mgroup.open .arrow{transform:rotate(90deg)}
.mchildren{display:none;padding:2px 0 4px}
.mgroup.open .mchildren{display:block}
.mitem{display:flex;align-items:center;gap:9px;padding:9px 12px 9px 42px;border-radius:9px;color:#48505f;cursor:pointer;font-size:13.5px;position:relative}
.mitem .dot{width:6px;height:6px;border-radius:50%;background:#c9cfdb;position:absolute;left:24px}
.mitem:hover{background:#f5f7fb}
.mitem.active{background:var(--brand-weak);color:var(--brand);font-weight:600}
.mitem.active .dot{background:var(--brand)}
.mtag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--brand);color:#fff}
.mtag.gray{background:#9aa3b2}
.mtag.purple{background:#7c5cf6}
.mtag.red{background:#e5484d}

.main{flex:1;margin-left:246px;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:20}
.topbar .crumb{font-size:14px;font-weight:600}
.topbar .crumb span{color:var(--sub);font-weight:400}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.whoami{display:flex;align-items:center;gap:8px;font-size:13px}
.whoami .av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.linkbtn{background:none;border:none;color:var(--sub);cursor:pointer;font-size:13px}
.linkbtn:hover{color:var(--brand)}
.content{padding:22px 24px;flex:1}

/* ---------- 卡片/面板 ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(20,30,60,.05)}
.card .c-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px;font-size:18px}
.card .c-num{font-size:26px;font-weight:700}
.card .c-lbl{font-size:13px;color:var(--sub);margin-top:3px}
.panel{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(20,30,60,.05);overflow:hidden;margin-bottom:18px}
.panel-hd{padding:15px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.panel-hd h3{font-size:15px;font-weight:600}
.panel-hd .sp{margin-left:auto}
.panel-bd{padding:4px 18px 10px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--sub);font-weight:500;background:#fafbfd}
tbody tr:hover td{background:#f8faff}
.thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;background:#f0f2f7;display:block}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:13px}

/* ---------- 组件 ---------- */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;line-height:18px}
.badge.on{background:#e8f6ee;color:#1a9c54}
.badge.off{background:#fdeced;color:#e5484d}
.badge.blue{background:var(--brand-weak);color:var(--brand)}
.badge.orange{background:#fff4e5;color:#f59e0b}
.badge.gray{background:#f0f2f7;color:#8a94a6}
.mini{height:32px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;color:#48505f}
.mini:hover{border-color:var(--brand);color:var(--brand)}
.mini.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.mini.primary:hover{background:var(--brand-deep)}
.mini.danger:hover{border-color:#e5484d;color:#e5484d}
.searchbox{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:13px;outline:none;width:200px}
.searchbox:focus{border-color:var(--brand)}
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:14px 4px}
.pager button{height:30px;min-width:30px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:13px;color:#48505f}
.pager button.active{background:var(--brand);border-color:var(--brand);color:#fff}
.pager button:disabled{opacity:.45;cursor:not-allowed}
.pager .info{color:var(--sub);font-size:12.5px;margin-right:auto}
.kv{display:grid;grid-template-columns:180px 1fr;gap:10px 16px;padding:6px 0}
.kv .k{color:var(--sub)}
.kv .v{color:var(--text);word-break:break-all}
.chk-tree{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fafbfd}
.chk-item{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:13px}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(20,25,40,.45);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{width:520px;max-width:92vw;max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:680px}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-hd h3{font-size:16px}
.modal-hd .x{margin-left:auto;cursor:pointer;color:var(--sub);font-size:20px;line-height:1;background:none;border:none}
.modal-bd{padding:20px 22px}
.modal-ft{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.form-row{margin-bottom:15px}
.form-row label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.form-row label .req{color:#e5484d}
.form-row input,.form-row textarea,.form-row select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;outline:none;font-family:inherit}
.form-row textarea{min-height:84px;resize:vertical}
.form-row input:focus,.form-row textarea:focus{border-color:var(--brand)}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#e5484d}
.loading{padding:40px;text-align:center;color:var(--sub);font-size:13px}
@media(max-width:820px){
  .sidebar{transform:translateX(-100%);transition:.25s;z-index:40}
  .sidebar.show{transform:none}
  .main{margin-left:0}
  .menu-btn{display:flex!important}
}
.menu-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border:none;background:none;cursor:pointer;font-size:20px;margin-right:8px}
/* ===== UI 装修实时预览 ===== */
.ui-decor-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.ui-decor-preview{flex:0 0 340px;display:flex;flex-direction:column;align-items:center;position:sticky;top:16px}
.ui-decor-panel{flex:1;min-width:320px;max-width:560px}
.phone-frame{width:320px;height:640px;background:#1a1a1a;border-radius:42px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
.phone-notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#1a1a1a;border-radius:0 0 18px 18px;z-index:5}
.phone-screen{width:100%;height:100%;background:#fff;border-radius:32px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.ps-statusbar{display:flex;justify-content:space-between;align-items:center;padding:8px 22px 4px;font-size:12px;font-weight:600;color:#333;flex-shrink:0}
.ps-content{flex:1;overflow-y:auto;padding:8px 14px 80px}
.ps-search{background:#f5f5f5;border-radius:20px;padding:8px 14px;font-size:13px;color:#999;margin:6px 0 12px}
.ps-banner-row{display:flex;gap:10px;margin-bottom:14px}
.ps-banner{flex:1;border-radius:12px;padding:14px 12px;font-size:15px;font-weight:700;color:#fff;line-height:1.3}
.ps-banner span{font-size:11px;font-weight:400;opacity:.9}
.ps-banner-male{background:linear-gradient(135deg,#667eea,#764ba2)}
.ps-banner-female{background:linear-gradient(135deg,#f093fb,#f5576c)}
.ps-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ps-avatar{width:50px;height:50px;border-radius:12px;flex-shrink:0}
.ps-info{flex:1;min-width:0}
.ps-info b{font-size:14px}
.ps-desc{font-size:11px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-btn{background:#FF7A45;color:#fff;border:2px solid #FF7A45;border-radius:20px;padding:5px 16px;font-size:12px;font-weight:600;flex-shrink:0}
.ps-tabbar{position:absolute;bottom:10px;left:12px;right:12px}
.ps-capsule{display:flex;align-items:center;justify-content:space-around;height:52px;background:#fff;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:0 6px}
.ps-ti{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;height:100%;position:relative;font-size:10px;cursor:pointer;transition:all .2s}
.ps-ti svg{width:22px;height:22px;margin-bottom:2px}
.ps-oval{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;z-index:0}
.ps-ti svg,.ps-ti span{position:relative;z-index:1}
.h5-preview-frame{width:100%;height:100%;border:none;border-radius:32px;background:#fff;display:block}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="modules.js"></script>
<script>
/* ================= 基础请求 ================= */
const LS_KEY='ya_admin_token', LS_UID='ya_admin_uid', LS_NAME='ya_admin_name';
const state={token:localStorage.getItem(LS_KEY)||'', uid:localStorage.getItem(LS_UID)||'', name:localStorage.getItem(LS_NAME)||''};
// H5 前端地址（用于实时预览 iframe）
const H5_URL='http://localhost:8000/h5/';

/* 模块配置：来自 modules.js（由 database/gen_biz_modules.py 生成） */
const MODULES=window.MODULES, MENU=window.MENU;
const SPECIAL=['dashboard','setting','profile','adminRole','adminMenu'];

function toast(msg, isErr){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast show'+(isErr?' err':'');
  clearTimeout(el._t); el._t=setTimeout(()=>el.className='toast',2200);
}

function buildParams(data){
  const p=new URLSearchParams();
  Object.keys(data||{}).forEach(k=>{
    const v=data[k];
    if(v===undefined||v===null) return;
    if(Array.isArray(v)) v.forEach(x=>p.append(k,x));
    else p.append(k,v);
  });
  return p;
}

async function req(path, data, method){
  method=method||'GET';
  const headers={'AdminToken':state.token,'AdminUserId':state.uid};
  if(path.indexOf('admin/')===0) path='adminapi/'+path.slice(6);
  let url='/'+path, opts={method:method, headers:headers};
  const isApi=path.indexOf('api/')===0;
  if(method==='POST'){
    if(isApi){
      headers['Content-Type']='application/json';
      opts.body=JSON.stringify(data||{});
    }else{
      headers['Content-Type']='application/x-www-form-urlencoded';
      opts.body=buildParams(data).toString();
    }
  }else{
    const qs=buildParams(data).toString();
    if(qs) url+='?'+qs;
  }
  let j;
  try{
    const res=await fetch(url,opts);
    j=await res.json();
  }catch(e){
    return {code:500,msg:'网络异常，请确认服务已启动'};
  }
  if(j && j.code===401){ logout(); throw new Error('unauth'); }
  return j;
}

function logout(){
  state.token='';state.uid='';state.name='';
  localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_UID);localStorage.removeItem(LS_NAME);
  renderLogin();
}

const ICONS={
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-5 8-5s6.5 1 8 5"/></svg>',
  headset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 13v-1a8 8 0 0116 0v1"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M20 19a3 3 0 01-3 3h-3"/></svg>',
  layout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg>',
  setting:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 00-1.7-1L14.5 3h-4l-.4 2.6a7 7 0 00-1.7 1l-2.3-1-2 3.4L6 11a7 7 0 000 2l-2 1.5 2 3.4 2.3-1a7 7 0 001.7 1L10.5 21h4l.4-2.6a7 7 0 001.7-1l2.3 1 2-3.4L19 13a7 7 0 000-1z"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></svg>',
  goods:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>',
  player:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="7" r="4"/><path d="M5 21c1-4 4-6 7-6s6 2 7 6"/><path d="M12 13v4"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h16"/></svg>'
};

/* ================= 渲染：登录 ================= */
function renderLogin(){
  document.getElementById('app').innerHTML=`
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">砚</div>
      <h1>砚世易游pro 后台管理</h1>
      <p class="tip">抢单神器 · 运营管理平台</p>
      <div class="login-err" id="lerr"></div>
      <div class="field"><label>账号</label><input id="lu" value="admin" autocomplete="username"></div>
      <div class="field"><label>密码</label><input id="lp" type="password" value="123456" autocomplete="current-password"></div>
      <button class="btn" id="lbtn" onclick="doLogin()">登 录</button>
      <p class="tip" style="margin-top:16px;margin-bottom:0">默认账号 admin / 123456</p>
    </div>
  </div>`;
  document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

async function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value.trim();
  const err=document.getElementById('lerr'); const btn=document.getElementById('lbtn');
  err.textContent='';
  if(!u||!p){err.textContent='请输入账号和密码';return;}
  btn.disabled=true;btn.textContent='登录中...';
  const j=await req('admin/AdminLogin/login',{username:u,password:p},'POST');
  btn.disabled=false;btn.textContent='登 录';
  if(j.code!==200){err.textContent=j.msg||'登录失败';return;}
  state.token=j.data.admin_token; state.uid=j.data.admin_user_id; state.name=u;
  localStorage.setItem(LS_KEY,state.token);localStorage.setItem(LS_UID,state.uid);localStorage.setItem(LS_NAME,state.name);
  location.hash='#/dashboard'; current.key='dashboard'; renderApp();
}

/* ================= 渲染：主框架 ================= */
let current={key:'dashboard', page:1, kw:''};

function renderApp(){
  const app=document.getElementById('app');
  app.innerHTML=`
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="logo">砚</div><div><div class="name">砚世易游pro</div><div class="sub">后台管理系统</div></div></div>
      <div class="side-search"><input id="menusearch" placeholder="搜索菜单" oninput="filterMenu(this.value)"></div>
      <nav class="menu" id="menu"></nav>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('show')">☰</button>
        <div class="crumb" id="crumb"></div>
        <div class="right">
          <div class="whoami"><div class="av">${(state.name||'A').slice(0,1).toUpperCase()}</div><span id="whoami-name">${state.name||'admin'}</span></div>
          <button class="linkbtn" onclick="logout()">退出</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>`;
  renderMenu();
  route();
}

function tagClass(t){
  if(t==='new') return 'red';
  if(t==='菜单') return 'purple';
  return '';
}

function renderMenu(){
  const m=document.getElementById('menu');
  m.innerHTML=MENU.map((g,gi)=>`
    <div class="mgroup ${g.open?'open':''}" data-gi="${gi}">
      <div class="mgroup-title" onclick="toggleGroup(this)"><span class="ic">${ICONS[g.ic]||ICONS.dots}</span>${g.group}<span class="arrow">›</span></div>
      <div class="mchildren">

const STATUS_MAP={1:['待处理','orange'],2:['已完成','on'],3:['处理中','blue']};
const PAY_MAP={1:['微信','on'],2:['支付宝','blue'],3:['银行卡','gray']};
const FLOW_MAP={1:['收入','on'],2:['支出','off']};

function cell(col,r){
  let v=r[col.f];
  if(v===undefined||v===null) v='';
  const t=col.type;
  if(t==='image') return v?`<img class="thumb" src="${v}" onerror="this.style.background='#f0f2f7';this.removeAttribute('src')">`:'<span class="badge gray">无图</span>';
  if(t==='disable') return v==1?'<span class="badge off">已禁用</span>':'<span class="badge on">正常</span>';
  if(t==='online') return v==1?'<span class="badge on">在线</span>':'<span class="badge gray">离线</span>';
  if(t==='status'){const m=STATUS_MAP[v]; return m?`<span class="badge ${m[1]}">${m[0]}</span>`:String(v);}
  if(t==='pay_type'){const m=PAY_MAP[v]; return m?`<span class="badge ${m[1]}">${m[0]}</span>`:String(v);}
  if(t==='flow_type'){const m=FLOW_MAP[v]; return m?`<span class="badge ${m[1]}">${m[0]}</span>`:String(v);}
  if(t==='noticetype') return v==1?'<span class="badge blue">公告</span>':'<span class="badge gray">规则</span>';
  if(t==='catparentname'){ if(!v||String(v)==='0') return '<span class="badge gray">顶级分类</span>'; return catNameById(v)||String(v); }
  if(t==='map'){const m=col.map&&col.map[v]; return m?`<span class="badge ${m[1]}">${m[0]}</span>`:String(v);}
  const s=String(v);
  return s.length>36?`<span title="${s.replace(/"/g,'')}">${s.slice(0,36)}…</span>`:s;
}

function renderPager(key,d){
  const t=document.getElementById('mpager');
  const pages=d.pages||1, cur=d.page||1;
  let btns='';
  for(let i=1;i<=pages;i++){
    if(i===1||i===pages||Math.abs(i-cur)<=1) btns+=`<button class="${i===cur?'active':''}" onclick="gotoPage('${key}',${i})">${i}</button>`;
    else if(Math.abs(i-cur)===2) btns+='<span style="color:#8a94a6">…</span>';
  }
  t.innerHTML=`<span class="info">共 ${d.count||0} 条 · 第 ${cur}/${pages} 页</span>
    <button ${cur<=1?'disabled':''} onclick="gotoPage('${key}',${cur-1})">上一页</button>${btns}
    <button ${cur>=pages?'disabled':''} onclick="gotoPage('${key}',${cur+1})">下一页</button>`;
}
function gotoPage(key,p){ current.page=p; loadList(key); }

function genCode(fid){
  const s='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<8;i++) c+=s[Math.floor(Math.random()*s.length)];

/* ================= 自定义颜色（后台界面 + 前端 H5 同源） ================= */
function hexToRgba(hex,a){
  hex=String(hex||'').replace('#','');
  if(hex.length===3) hex=hex.split('').map(x=>x+x).join('');
  if(hex.length!==6) return '';
  const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}
function applyThemeVars(t){
  if(!t) return;
  const root=document.documentElement.style;
  if(t.primary){
    root.setProperty('--brand',t.primary);
    const weak=hexToRgba(t.primary,.12); if(weak) root.setProperty('--brand-weak',weak);
  }
  if(t.secondary) root.setProperty('--brand-deep',t.secondary);
}
async function applyTheme(){
  try{
    const j=await req('admin/AdminSetting/settingTheme');
    if(j.code===200) applyThemeVars(j.data||{});
  }catch(e){}
}

async function openForm(key,mode,id){
  const cfg=MODULES[key];
  let row={};
  if(mode==='edit'){
    const j=await req(cfg.apis.info,{[cfg.idField]:id});
    if(j.code!==200){toast(j.msg||'读取失败',true);return;}
    row=j.data||{};
  }
  const fields=cfg.form.filter(f=>!(f.only==='add'&&mode==='edit'));
  if(needsCats(cfg)) await loadCats();
  const html=fields.map(f=>{
    const val=row[f.f]!==undefined&&row[f.f]!==null?row[f.f]:'';
    let input;
    if(f.type==='textarea') input=`<textarea id="fld_${f.f}">${val}</textarea>`;
    else if(f.type==='select') input=`<select id="fld_${f.f}">${f.opts.map(o=>`<option value="${o[0]}" ${String(val)===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select>`;
    else if(f.type==='number') input=`<input id="fld_${f.f}" type="number" value="${val}">`;
    else if(f.type==='hidden') input=`<input type="hidden" id="fld_${f.f}" value="${String(val).replace(/"/g,'&quot;')}">`;
    else if(f.type==='catparent') input=`<select id="fld_${f.f}"><option value="0" ${!val||String(val)==='0'?'selected':''}>顶级分类</option>${catsTop().map(c=>`<option value="${c.category_id}" ${String(val)===String(c.category_id)?'selected':''}>${c.category_name}</option>`).join('')}</select>`;
    else if(f.type==='catselect') input=`<select id="fld_${f.f}" onchange="csOnParentChange(this.value)"><option value="0">请选择一级分类</option>${catsTop().map(c=>`<option value="${c.category_id}" ${String(val)===String(c.category_id)?'selected':''}>${c.category_name}</option>`).join('')}</select>`;
    else if(f.type==='subcatselect') input=`<select id="fld_${f.f}" onchange="csSyncCatName()"><option value="0">请选择二级分类</option>${catsChild(row['category_pid']||0).map(c=>`<option value="${c.category_id}" ${String(val)===String(c.category_id)?'selected':''}>${c.category_name}</option>`).join('')}</select>`;
    else if(f.type==='codegen') input=`<div style="display:flex;gap:8px"><input id="fld_${f.f}" value="${String(val).replace(/"/g,'&quot;')}" placeholder="留空保存时自动生成"><button type="button" class="mini" onclick="genCode('${f.f}')">随机生成</button></div>`;
    else input=`<input id="fld_${f.f}" value="${String(val).replace(/"/g,'&quot;')}">`;
    return `<div class="form-row"><label>${f.t}${f.req?' <span class="req">*</span>':''}</label>${input}${f.f==='image'||f.f==='avatar'?'<div class="hint">填写图片完整地址，如 https://... 或 /storage/...</div>':''}</div>`;
  }).join('');
  const mask=document.createElement('div');
  mask.className='mask';
  mask.innerHTML=`<div class="modal">
    <div class="modal-hd"><h3>${mode==='add'?'新增':'编辑'}${cfg.name}</h3><button class="x" onclick="this.closest('.mask').remove()">×</button></div>
    <div class="modal-bd">${html}</div>
    <div class="modal-ft">
      <button class="mini" onclick="this.closest('.mask').remove()">取消</button>
      <button class="mini primary" onclick="submitForm('${key}','${mode}',${id||0})">保存</button>
    </div></div>`;
  mask.addEventListener('click',e=>{if(e.target===mask)mask.remove();});
  document.body.appendChild(mask);
  if(document.getElementById('fld_category_name')) csSyncCatName();
}

async function submitForm(key,mode,id){
  const cfg=MODULES[key];
  const data={};
  cfg.form.filter(f=>!(f.only==='add'&&mode==='edit')).forEach(f=>{
    const el=document.getElementById('fld_'+f.f); if(el) data[f.f]=el.value;
  });
  if(mode==='edit') data[cfg.idField]=id;
  const api=mode==='add'?cfg.apis.add:cfg.apis.edit;
  const j=await req(api,data,'POST');
  if(j.code===200){
    toast(mode==='add'?'新增成功':'保存成功');
    document.querySelector('.mask')&&document.querySelector('.mask').remove();
    if(key==='category') CATS=null;
    loadList(key);
  }else{
    toast(j.msg||'保存失败',true);
  }
}

  dlg.querySelector('#iv_save').onclick=async()=>{
    const type=dlg.querySelector('#iv_type').value;
    const name=dlg.querySelector('#iv_name').value.trim();
    const user_id=parseInt(dlg.querySelector('#iv_uid').value)||0;
    const api=id?'api/invite/edit':'api/invite/add';
    // 邀请码由服务端生成/不可修改，前端不提交 code 字段
    const body=id?{id,type,name,user_id}:{type,name,user_id};
    const j=await req(api,body,'POST');
    if(j.code===1){
      const gen=(!id&&j.data&&j.data.code)?`（邀请码：${j.data.code}）`:'';
      toast('保存成功'+gen);
      dlg.remove();
      renderInviteCode();
    }
    else toast(j.msg||'保存失败',true);
  };

function colorRow(id,label,val){
  return `<div class="form-row"><label>${label}</label>
    <div style="display:flex;gap:10px;align-items:center">
      <input type="color" id="${id}" value="${val}" oninput="syncText('${id}');uiRefresh()" style="width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;cursor:pointer">
      <input id="${id}_t" value="${val}" style="flex:1" oninput="syncColor('${id}');uiRefresh()">
    </div></div>`;
}
function syncText(id){ document.getElementById(id+'_t').value=document.getElementById(id).value; }
function syncColor(id){
  const v=document.getElementById(id+'_t').value.trim();
  if(/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById(id).value=v;
}
function uiGetCfg(){
  const g=id=>document.getElementById(id)&&document.getElementById(id).value;
  const gt=id=>document.getElementById(id+'_t')&&document.getElementById(id+'_t').value;
  return {
    theme_primary: gt('ui_theme_primary')||g('ui_theme_primary'),
    theme_secondary: gt('ui_theme_secondary')||g('ui_theme_secondary'),
    app_bg_color: gt('ui_bg_color')||g('ui_bg_color'),
    tabbar_bg: gt('ui_tab_bg')||g('ui_tab_bg'),
    tabbar_active_color: gt('ui_tab_active')||g('ui_tab_active'),
    tabbar_inactive_color: g('ui_tab_inactive'),
    tabbar_ellipse_color: gt('ui_ellipse'),
    tabbar_style: g('ui_style')
  };
}
function uiRefresh(){
  const cfg=uiGetCfg();
  // 实时推送配置到 H5 iframe
  const frame=document.getElementById('h5PreviewFrame');
  if(frame && frame.contentWindow){
    try{
      frame.contentWindow.postMessage({type:'ui-preview',config:cfg},'*');
    }catch(e){}
  }
}
function onH5PreviewLoad(){
  // iframe 加载完成后推送当前配置，重试几次确保 H5 监听器已就绪
  let tries=0;
  const push=()=>{
    uiRefresh();
    if(tries++<5) setTimeout(push,300);
  };
  push();
}
function uiSetActive(i){ uiPreviewActive=i; uiRefresh(); }
function uiReset(){

  document.getElementById('ui_tab_inactive').value='rgba(60,40,30,.55)';

async function saveSetting(type){
  let j;
  if(type==='verify'){
    j=await req('admin/AdminSetting/settingVerify',{
      type:document.getElementById('vf_type').value,
      length:document.getElementById('vf_length').value,
      expire:document.getElementById('vf_expire').value,
      switch:document.getElementById('vf_switch').value,
    },'POST');
  }else if(type==='theme'){
    j=await req('admin/AdminSetting/settingTheme',{
      primary:document.getElementById('th_primary_t').value.trim(),
      secondary:document.getElementById('th_secondary_t').value.trim(),
    },'POST');
    if(j.code===200) applyThemeVars(j.data||{});
  }else if(type==='cs'){
    j=await req('admin/AdminSetting/settingCustomerService',{
      builtin_enabled:document.getElementById('cs_builtin').value,
    },'POST');
  }else if(type==='appui'){
    const items=[
      {name:'app_bg_color',value:document.getElementById('au_bg_color_t').value.trim()},
      {name:'app_bg_image',value:document.getElementById('au_bg_image').value.trim()},
      {name:'theme_primary',value:document.getElementById('au_primary_t').value.trim()},
      {name:'theme_secondary',value:document.getElementById('au_secondary_t').value.trim()},
      {name:'tabbar_active_color',value:document.getElementById('au_tab_active_t').value.trim()},
    ];
    j=await req('api/config/save',{items},'POST');
  }else{
    j=await req('admin/AdminSetting/settingToken',{
      iss:document.getElementById('tk_iss').value,
      exp:document.getElementById('tk_exp').value,
    },'POST');
  }
  if(j.code===200||j.code===1) toast('保存成功'); else toast(j.msg||'保存失败',true);
}
async function uploadBg(input){
  const file=input.files&&input.files[0];
  if(!file) return;
  const fd=new FormData();
  fd.append('file',file);
  let j;
  try{
    const res=await fetch('/api/config/uploadBg',{method:'POST',body:fd,headers:{'AdminToken':state.token,'AdminUserId':state.uid}});
    j=await res.json();
  }catch(e){ toast('上传失败',true); return; }
  if(j.code===1){
    const url=j.data&&j.data.url;
    if(url){ document.getElementById('au_bg_image').value=url; toast('上传成功'); }
    else toast('上传失败',true);
  }else{ toast(j.msg||'上传失败',true); }
}

/* ================= 角色组 ================= */
async function fetchMenuTree(){
  const j=await req('admin/AdminMenu/menuList');
  const tree=(j.data&&j.data.list)||[];
  const flat=[];
  (function walk(nodes,depth){
    (nodes||[]).forEach(n=>{
      if(n.is_delete==1) return;
      flat.push({id:n.admin_menu_id,name:n.menu_name,url:n.menu_url||'',depth:depth});
      if(n.children&&n.children.length) walk(n.children,depth+1);
    });
  })(tree,0);
  return flat;
}
async function renderRole(){
  document.getElementById('crumb').innerHTML='权限管理 <span>· 角色组</span>';
  const c=document.getElementById('content');
  c.innerHTML=`
    <div class="panel">
      <div class="panel-hd"><h3>角色组</h3><div class="sp"></div>
        <button class="mini primary" onclick="openRoleForm('add')">+ 新增角色</button>
      </div>
      <div class="panel-bd" id="rtable"><div class="loading">加载中...</div></div>
      <div class="pager" id="rpager"></div>
    </div>`;
  loadRoles();
}
async function loadRoles(){
  const wrap=document.getElementById('rtable');
  wrap.innerHTML='<div class="loading">加载中...</div>';
  const j=await req('admin/AdminRole/roleList',{page:1,limit:20});
  if(j.code!==200){wrap.innerHTML=`<div class="empty">加载失败：${j.msg||''}</div>`;return;}
  const rows=(j.data&&j.data.list)||[];
  if(!rows.length){wrap.innerHTML='<div class="empty">暂无数据</div>';return;}
  wrap.innerHTML=`<table><thead><tr><th>ID</th><th>角色名称</th><th>描述</th><th>状态</th><th style="width:200px">操作</th></tr></thead>
  <tbody>${rows.map(r=>`<tr>
    <td>${r.admin_role_id}</td><td>${r.role_name}</td><td>${r.role_desc||''}</td>
    <td>${r.is_disable==1?'<span class="badge off">已禁用</span>':'<span class="badge on">正常</span>'}</td>
    <td>
      <button class="mini" onclick="openRoleForm('edit',${r.admin_role_id})">编辑/权限</button>
      <button class="mini" onclick="toggleRoleDisable(${r.admin_role_id},${r.is_disable?0:1})">${r.is_disable?'启用':'禁用'}</button>
      <button class="mini danger" onclick="deleRole(${r.admin_role_id})">删除</button>
    </td></tr>`).join('')}</tbody></table>`;
  document.getElementById('rpager').innerHTML='';
}
async function openRoleForm(mode,id){
  let row={};
  if(mode==='edit'){
    const j=await req('admin/AdminRole/roleInfo',{admin_role_id:id});
    if(j.code!==200){toast(j.msg||'读取失败',true);return;}
    row=j.data||{};
  }
  const flat=await fetchMenuTree();
  const checked={};
  String(row.admin_menu_ids||'').split(',').filter(Boolean).forEach(x=>checked[x]=1);
  const chk=flat.map(m=>`<label class="chk-item" style="padding-left:${m.depth*18}px">
    <input type="checkbox" value="${m.id}" ${checked[m.id]?'checked':''}> ${m.name}${m.url?`<span style="color:#b6bcc8;font-size:11px">(${m.url})</span>`:''}
  </label>`).join('');
  const mask=document.createElement('div');
  mask.className='mask';
  mask.innerHTML=`<div class="modal wide">
    <div class="modal-hd"><h3>${mode==='add'?'新增':'编辑'}角色</h3><button class="x" onclick="this.closest('.mask').remove()">×</button></div>
    <div class="modal-bd">
      <div class="form-row"><label>角色名称 <span class="req">*</span></label><input id="r_name" value="${row.role_name||''}"></div>
      <div class="form-row"><label>描述</label><input id="r_desc" value="${row.role_desc||''}"></div>
      <div class="form-row"><label>排序</label><input id="r_sort" type="number" value="${row.role_sort||200}"></div>
      <div class="form-row"><label>菜单权限</label><div class="chk-tree" id="r_tree">${chk}</div>
        <div class="hint">勾选该角色可访问的菜单/接口。</div></div>
    </div>
    <div class="modal-ft">
      <button class="mini" onclick="this.closest('.mask').remove()">取消</button>
      <button class="mini primary" onclick="submitRole('${mode}',${id||0})">保存</button>
    </div></div>`;
  mask.addEventListener('click',e=>{if(e.target===mask)mask.remove();});
  document.body.appendChild(mask);
}
async function submitRole(mode,id){
  const ids=[...document.querySelectorAll('#r_tree input:checked')].map(x=>x.value);
  const data={
    role_name:document.getElementById('r_name').value.trim(),
    role_desc:document.getElementById('r_desc').value.trim(),
    role_sort:document.getElementById('r_sort').value,
    admin_menu_ids:ids,
  };
  if(!data.role_name){toast('请输入角色名称',true);return;}
  if(mode==='edit') data.admin_role_id=id;
  const api=mode==='add'?'admin/AdminRole/roleAdd':'admin/AdminRole/roleEdit';
  const j=await req(api,data,'POST');
  if(j.code===200){toast('保存成功');document.querySelector('.mask')&&document.querySelector('.mask').remove();loadRoles();}
  else toast(j.msg||'保存失败',true);
}
async function toggleRoleDisable(id,isDisable){
  const j=await req('admin/AdminRole/roleDisable',{admin_role_id:id,is_disable:isDisable},'POST');
  if(j.code===200){toast(isDisable?'已禁用':'已启用');loadRoles();} else toast(j.msg||'操作失败',true);
}
async function deleRole(id){
  if(!confirm('确定删除该角色？')) return;
  const j=await req('admin/AdminRole/roleDele',{admin_role_id:id},'POST');
  if(j.code===200){toast('删除成功');loadRoles();} else toast(j.msg||'删除失败',true);
}

/* ================= 菜单规则 ================= */
async function renderMenuRules(){
  document.getElementById('crumb').innerHTML='权限管理 <span>· 菜单规则</span>';
  const c=document.getElementById('content');
  c.innerHTML=`
    <div class="panel">
      <div class="panel-hd"><h3>菜单规则</h3><div class="sp"></div>
        <button class="mini primary" onclick="openMenuForm('add',0)">+ 新增菜单</button>
      </div>
      <div class="panel-bd" id="mrtable"><div class="loading">加载中...</div></div>
    </div>`;
  loadMenuRules();
}
async function loadMenuRules(){
  const wrap=document.getElementById('mrtable');
  wrap.innerHTML='<div class="loading">加载中...</div>';
  const flat=await fetchMenuTree();
  if(!flat.length){wrap.innerHTML='<div class="empty">暂无菜单</div>';return;}
  wrap.innerHTML=`<table><thead><tr><th>ID</th><th>菜单名称</th><th>接口地址</th><th style="width:170px">操作</th></tr></thead>
  <tbody>${flat.map(m=>`<tr>
    <td>${m.id}</td>
    <td style="padding-left:${18+m.depth*20}px">${m.name}</td>
    <td>${m.url?`<span style="color:#8a94a6">${m.url}</span>`:'<span style="color:#c9cfdb">-</span>'}</td>
    <td>
      <button class="mini" onclick="openMenuForm('edit',${m.id})">编辑</button>
      <button class="mini" onclick="openMenuForm('add',${m.id})">加子菜单</button>
      <button class="mini danger" onclick="deleMenu(${m.id})">删除</button>
    </td></tr>`).join('')}</tbody></table>`;
}
async function openMenuForm(mode,id){
  let row={menu_pid:id,menu_name:'',menu_url:'',menu_sort:200};
  if(mode==='edit'){
    const j=await req('admin/AdminMenu/menuInfo',{admin_menu_id:id});
    if(j.code!==200){toast(j.msg||'读取失败',true);return;}
    row=j.data||{};
  }
  const mask=document.createElement('div');
  mask.className='mask';
  mask.innerHTML=`<div class="modal">
    <div class="modal-hd"><h3>${mode==='add'?'新增菜单':'编辑菜单'}</h3><button class="x" onclick="this.closest('.mask').remove()">×</button></div>
    <div class="modal-bd">
      <div class="form-row"><label>上级菜单ID（0为顶级）</label><input id="mn_pid" type="number" value="${row.menu_pid||0}"></div>
      <div class="form-row"><label>菜单名称 <span class="req">*</span></label><input id="mn_name" value="${row.menu_name||''}"></div>
      <div class="form-row"><label>接口地址</label><input id="mn_url" value="${row.menu_url||''}"><div class="hint">格式：admin/控制器/方法，如 admin/Order/orderList</div></div>
      <div class="form-row"><label>排序</label><input id="mn_sort" type="number" value="${row.menu_sort||200}"></div>
    </div>
    <div class="modal-ft">
      <button class="mini" onclick="this.closest('.mask').remove()">取消</button>
      <button class="mini primary" onclick="submitMenu('${mode}',${id||0})">保存</button>
    </div></div>`;
  mask.addEventListener('click',e=>{if(e.target===mask)mask.remove();});
  document.body.appendChild(mask);
}
async function submitMenu(mode,id){
  const data={
    menu_pid:document.getElementById('mn_pid').value,
    menu_name:document.getElementById('mn_name').value.trim(),
    menu_url:document.getElementById('mn_url').value.trim(),
    menu_sort:document.getElementById('mn_sort').value,
  };
  if(!data.menu_name){toast('请输入菜单名称',true);return;}
  if(mode==='edit') data.admin_menu_id=id;
  const api=mode==='add'?'admin/AdminMenu/menuAdd':'admin/AdminMenu/menuEdit';
  const j=await req(api,data,'POST');
  if(j.code===200){toast('保存成功');document.querySelector('.mask')&&document.querySelector('.mask').remove();loadMenuRules();}
  else toast(j.msg||'保存失败',true);
}
async function deleMenu(id){
  if(!confirm('确定删除该菜单？')) return;
  const j=await req('admin/AdminMenu/menuDele',{admin_menu_id:id},'POST');
  if(j.code===200){toast('删除成功');loadMenuRules();} else toast(j.msg||'删除失败',true);
}

/* ================= 启动 ================= */
(function boot(){
  const hashKey=location.hash.replace('#/','')||'dashboard';
  if(state.token){
    current.key=(MODULES[hashKey]||SPECIAL.includes(hashKey))?hashKey:'dashboard';
    applyTheme();
    renderApp();
  }else renderLogin();
})();
</script>
