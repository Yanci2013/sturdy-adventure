<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-heading">
        <div class="panel-lead"><em>管理礼物信息</em></div>
        <ul class="nav nav-tabs">
            <li class="active"><a href="#tab1" data-toggle="tab">礼物列表</a></li>
        </ul>
    </div>
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="tab1">
                <div class="toolbar">
                    <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
                    <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('gift/add')?'':'hide'}" title="{:__('Add')}"><i class="fa fa-plus"></i> 添加礼物</a>
                    <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('gift/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> 编辑</a>
                    <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('gift/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> 删除</a>
                </div>
                <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                       data-operate-edit="{:$auth->check('gift/edit')}"
                       data-operate-del="{:$auth->check('gift/del')}"
                       width="100%">
                </table>
            </div>
        </div>
    </div>
</div>
