<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
   <div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">{:__('Image_url')}:</label>
    <div class="col-xs-12 col-sm-8">
        <div class="input-group">
            <input id="c-image_url" data-rule="required" class="form-control" name="row[image_url]" type="text" value="{$row.image_url|htmlentities}">
            <div class="input-group-addon no-border no-padding">
                <span>
                    <button type="button" id="faupload-image_url"
                            class="btn btn-danger faupload"
                            data-input-id="c-image_url"
                            data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp"
                            data-multiple="false"
                            data-preview-id="p-image_url">
                        <i class="fa fa-upload"></i> {:__('Upload')}
                    </button>
                </span>
                <span>
                    <button type="button" id="fachoose-image_url"
                            class="btn btn-primary fachoose"
                            data-input-id="c-image_url"
                            data-mimetype="image/*"
                            data-multiple="false">
                        <i class="fa fa-list"></i> {:__('Choose')}
                    </button>
                </span>
            </div>
            <span class="msg-box n-right" for="c-image_url"></span>
        </div>
        <ul class="row list-inline faupload-preview" id="p-image_url"></ul>
    </div>
</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Link_url')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-link_url" data-rule="required" class="form-control" name="row[link_url]" type="text" value="{$row.link_url|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Sort')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sort" data-rule="required" class="form-control" name="row[sort]" type="number" value="{$row.sort|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-status" data-rule="required" class="form-control" name="row[status]" type="number" value="{$row.status|htmlentities}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
