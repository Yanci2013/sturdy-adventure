<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">目标类型:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label for="target_type-1"><input id="target_type-1" name="row[target_type]" type="radio" value="1" /> 全部打手</label>
                <label for="target_type-2"><input id="target_type-2" name="row[target_type]" type="radio" value="2" checked /> 指定打手</label>
            </div>
        </div>
    </div>
    <div class="form-group" id="thug-group">
        <label class="control-label col-xs-12 col-sm-2">打手:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-thug_id" data-source="thugfine/thuglist" data-field="name" class="form-control selectpage" name="row[thug_id]" type="text" value="{$thug_id}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">罚款金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" data-rule="required" class="form-control" name="row[amount]" type="number" step="0.01" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">处罚类型:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                <label for="punish_type-1"><input id="punish_type-1" name="row[punish_type]" type="radio" value="1" checked /> 禁止接单+禁止提现</label>
                <label for="punish_type-2"><input id="punish_type-2" name="row[punish_type]" type="radio" value="2" /> 可正常接单但禁止提现</label>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">罚款理由:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-reason" data-rule="required" class="form-control" rows="5" name="row[reason]" cols="50"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">确定</button>
            <button type="reset" class="btn btn-default btn-embossed">重置</button>
        </div>
    </div>
</form>
