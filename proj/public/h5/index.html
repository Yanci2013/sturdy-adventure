<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<link rel="stylesheet" href="/h5/assets/uni.b4ab26bd.css">

		<meta charset="UTF-8" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<script>
			var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
				CSS.supports('top: constant(a)'))
			document.write(
				'<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
				(coverSupport ? ', viewport-fit=cover' : '') + '" />')
		</script>
		<title>创世网络</title>
		<!-- 引入微信 JSSDK -->
		<script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
		<!--preload-links-->
		<!--app-context-->
		<script type="module" crossorigin src="/h5/assets/index-BoZ5LyYT.js"></script>
		<link rel="stylesheet" crossorigin href="/h5/assets/index-tN4KgB7k.css">

		<style>
			/* ===== 前端背景装修（由 configure 配置驱动，颜色/图片可在后台设置） ===== */
			html, body, #app { height: 100%; margin: 0; padding: 0; }
			body {
				background: #eef4ff;
				background-attachment: fixed;
				background-size: cover;
				background-position: center;
			}

			/* ===== 加载页（创世网络 1→100%） ===== */
			#cs-loader {
				position: fixed; inset: 0; z-index: 99999;
				background: linear-gradient(180deg, #eef4ff 0%, #ffffff 100%);
				display: flex; flex-direction: column; align-items: center;
				font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
				transition: opacity .4s ease;
			}
			#cs-loader.cs-hide { opacity: 0; pointer-events: none; }

			.cs-loader-title {
				margin-top: 14vh; font-size: 20px; font-weight: 600; color: #1f1f1f; letter-spacing: 1px;
			}
			.cs-logo-wrap {
				margin-top: 6vh; width: 132px; height: 132px; border-radius: 30px; overflow: hidden;
				box-shadow: 0 12px 32px rgba(0,0,0,.12); background: #fff;
				display: flex; align-items: center; justify-content: center;
			}
			.cs-logo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
			.cs-brand-name {
				margin-top: 22px; font-size: 26px; font-weight: 800; color: #1f1f1f; letter-spacing: 1px;
			}
			.cs-brand-sub {
				margin-top: 8px; font-size: 14px; color: #9aa3b2;
			}

			.cs-progress-card {
				margin-top: 38px; width: 82%; max-width: 360px; background: #fff;
				border-radius: 16px; padding: 18px 18px 14px;
				box-shadow: 0 6px 24px rgba(0,0,0,.06);
			}
			.cs-progress-head { display: flex; justify-content: space-between; align-items: baseline; }
			.cs-progress-status { font-size: 16px; font-weight: 600; color: #1f1f1f; }
			.cs-progress-step { font-size: 12px; color: #9aa3b2; margin-top: 2px; }
			.cs-progress-percent { font-size: 26px; font-weight: 700; color: #1f1f1f; }
			.cs-progress-bar {
				margin-top: 14px; width: 100%; height: 8px; border-radius: 999px;
				background: #eef1f6; overflow: hidden;
			}
			.cs-progress-bar i {
				display: block; height: 100%; width: 0%; border-radius: 999px;
				background: linear-gradient(90deg, var(--cs-primary, #4f7cff), var(--cs-secondary, #6aa0ff));
				transition: width .25s ease;
			}
			.cs-progress-foot {
				margin-top: 12px; display: flex; justify-content: space-between; align-items: center;
				font-size: 13px; color: #9aa3b2;
			}
			.cs-dot { width: 9px; height: 9px; border-radius: 50%; background: #34c759; display: inline-block; margin-right: 6px; vertical-align: middle; box-shadow: 0 0 0 3px rgba(52,199,89,.18); }

			.cs-footer {
				position: absolute; bottom: 6vh; left: 0; right: 0; text-align: center;
				font-size: 13px; color: #9aa3b2;
			}
			.cs-footer .cs-check { color: #34c759; font-weight: 600; margin-right: 4px; }
		</style>
	</head>
	<body>
		<!-- 加载页 -->
		<div id="cs-loader">
			<div class="cs-loader-title">正在加载</div>
			<div class="cs-logo-wrap"><img id="cs-logo" src="/h5/static/eon.png" alt="logo"></div>
			<div class="cs-brand-name" id="cs-brand">创世网络</div>
			<div class="cs-brand-sub">正在为你准备服务</div>

			<div class="cs-progress-card">
				<div class="cs-progress-head">
					<div>
						<div class="cs-progress-status" id="cs-status">正在加载俱乐部信息</div>
						<div class="cs-progress-step" id="cs-step">0/17</div>
					</div>
					<div class="cs-progress-percent" id="cs-percent">0%</div>
				</div>
				<div class="cs-progress-bar"><i id="cs-bar"></i></div>
				<div class="cs-progress-foot">
					<span><span class="cs-dot"></span>安全连接</span>
					<span>请稍候</span>
				</div>
			</div>

			<div class="cs-footer"><span class="cs-check">✓</span>正在加载页面资源</div>
		</div>

		<div id="app"><!--app-html--></div>

		<script>
			/* ===== 读取后台装修配置：背景色/背景图/加载页/底部导航/功能标识 ===== */
			(function () {
				var statuses = [
					'正在加载俱乐部信息', '正在初始化资源', '正在加载页面资源',
					'正在预热页面', '正在连接服务器', '即将进入'
				];
				var percent = 0;
				var bar = document.getElementById('cs-bar');
				var pct = document.getElementById('cs-percent');
				var st  = document.getElementById('cs-status');
				var step = document.getElementById('cs-step');
				var brand = document.getElementById('cs-brand');
				var logo = document.getElementById('cs-logo');
				var loader = document.getElementById('cs-loader');

				// 预览模式（装修后台嵌入 iframe 预览时用）：跳过加载页
				var isPreview = /[?&]preview=1/.test(location.search) || /preview=1/.test(location.hash);
				if (isPreview) { loader.style.display = 'none'; }

				// 保持注入的样式节点始终位于 head 末尾（优先级高于 uni-app 动态注入的样式）
				var keepNodes = [];
				var headObservers = 0;
				function ensureStyle(id) {
					var s = document.getElementById(id);
					if (!s) { s = document.createElement('style'); s.id = id; document.head.appendChild(s); }
					if (keepNodes.indexOf(s) < 0) keepNodes.push(s);
					return s;
				}
				function watchHead() {
					if (headObservers) return;
					headObservers = 1;
					new MutationObserver(function () {
						var len = keepNodes.length;
						if (!len) return;
						var kids = document.head.children;
						var tailOk = kids.length >= len;
						if (tailOk) {
							for (var i = 0; i < len; i++) {
								if (kids[kids.length - len + i] !== keepNodes[i]) { tailOk = false; break; }
							}
						}
						if (tailOk) return;
						// 我们的样式节点必须始终位于 head 末尾，才能压过 uni-app 动态注入的样式
						for (var j = 0; j < len; j++) document.head.appendChild(keepNodes[j]);
					}).observe(document.head, { childList: true });
				}

				/* ===== 1. 页面背景色/背景图 ===== */
				function applyBg(cfg) {
					var color = (cfg && cfg.app_bg_color) ? cfg.app_bg_color : '';
					var image = (cfg && cfg.app_bg_image) ? cfg.app_bg_image : '';
					if (!color && !image) return;

					var bgValue = color
						? (image ? color + ' url("' + image + '") center/cover fixed no-repeat' : color)
						: ('url("' + image + '") center/cover fixed no-repeat');

					document.body.style.setProperty('background', bgValue, 'important');
					document.documentElement.style.setProperty('background', bgValue, 'important');

					var s = ensureStyle('cs-bg-override');
					s.textContent = 'html,body,#app,page,uni-page-body,.page,.main-container{background:' + bgValue + ' !important;background-size:cover !important;background-position:center !important;background-attachment:fixed !important;}';
					watchHead();
				}

				/* ===== 2. 底部导航栏换色 + 选中/点击动效 ===== */
				function buildTabbarCss(mode) {
					var css = [];
					// 胶囊（大椭圆）背景
					css.push('.tabbar-capsule.tabbar-capsule{background:var(--cs-tb-bg,linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,244,235,.65))) !important;}');
					css.push('.tabbar-item.tabbar-item{position:relative !important;overflow:visible !important;}');
					css.push('.tabbar-item.tabbar-item>*{position:relative;z-index:2;}');
					// 文字颜色
					css.push('.tabbar-text.tabbar-text{color:var(--cs-tb-inactive) !important;}');
					css.push('.tabbar-item.tabbar-active .tabbar-text.tabbar-text{color:var(--cs-tb-active) !important;font-weight:600 !important;}');
					if (mode === 'color') {
						// 大椭圆 + 图标变色：无小椭圆，选中项图标/文字变色
						css.push('.tabbar-item.tabbar-item::before{display:none !important;}');
						css.push('.tabbar-icon.tabbar-icon{transition:transform .22s ease,filter .22s ease;}');
						css.push('.tabbar-item.tabbar-active .tabbar-icon.tabbar-icon{transform:scale(1.14);filter:drop-shadow(0 0 .16rem var(--cs-tb-active)) drop-shadow(0 0 .3rem var(--cs-tb-active));}');
					} else {
						// 大椭圆 + 小椭圆：选中项出现小椭圆高亮
						css.push('.tabbar-item.tabbar-item::before{content:"";position:absolute;left:50%;top:50%;width:3.2rem;height:2.4rem;border-radius:50%;background:var(--cs-tb-ellipse);opacity:0;transform:translate(-50%,-50%) scale(.55);transition:opacity .22s ease,transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:1;}');
						css.push('.tabbar-item.tabbar-active.tabbar-active::before{opacity:.22;transform:translate(-50%,-50%) scale(1);}');
					}
					// 点击动效：先弹出一个大椭圆，再收成小椭圆后淡出
					css.push('.tabbar-item.tabbar-item::after{content:"";position:absolute;left:50%;top:50%;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--cs-tb-ellipse);opacity:0;transform:translate(-50%,-50%) scale(.15);pointer-events:none;z-index:0;}');
					css.push('.tabbar-item.cs-tap::after{animation:cs-ellipse-pop .5s ease-out;}');
					css.push('@keyframes cs-ellipse-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}35%{opacity:.35;transform:translate(-50%,-50%) scale(2)}100%{opacity:0;transform:translate(-50%,-50%) scale(.6)}}');
					return css.join('\n');
				}

				var tabBound = false;
				function bindTabbarTap() {
					if (tabBound) return;
					tabBound = true;
					document.addEventListener('click', function (e) {
						var el = e.target;
						while (el && !(el.classList && el.classList.contains('tabbar-item'))) el = el.parentNode;
						if (!el || !el.classList) return;
						el.classList.remove('cs-tap');
						void el.offsetWidth; // 触发重排以重放动画
						el.classList.add('cs-tap');
						setTimeout(function () { el.classList.remove('cs-tap'); }, 520);
					}, true);
				}

				function applyTabbar(cfg) {
					cfg = cfg || {};
					var active = cfg.tabbar_active_color || cfg.theme_primary || '#FF7A45';
					var inactive = cfg.tabbar_inactive_color || 'rgba(60,40,30,.55)';
					var ellipse = cfg.tabbar_ellipse_color || active;
					var mode = cfg.tabbar_style || 'ellipse';
					var root = document.documentElement.style;
					root.setProperty('--cs-tb-active', active);
					root.setProperty('--cs-tb-inactive', inactive);
					root.setProperty('--cs-tb-ellipse', ellipse);
					if (cfg.tabbar_bg) root.setProperty('--cs-tb-bg', cfg.tabbar_bg);
					else root.removeProperty('--cs-tb-bg');
					ensureStyle('cs-tabbar-skin').textContent = buildTabbarCss(mode);
					bindTabbarTap();
					watchHead();
				}

				/* ===== 3. 功能标识（角标）颜色 ===== */
				function applyBadge(cfg) {
					var color = (cfg && cfg.badge_color) || '#FF3B30';
					document.documentElement.style.setProperty('--cs-badge', color);
					ensureStyle('cs-badge-skin').textContent =
						'.u-badge.u-badge{background-color:var(--cs-badge) !important;}' +
						'.u-badge--error.u-badge--error,.u-badge--primary.u-badge--primary,.u-badge--warning.u-badge--warning{background-color:var(--cs-badge) !important;}';
					watchHead();
				}

				/* ===== 主题色：覆盖 uni-app / uview 主色组件 ===== */
				function applyThemeColor(cfg) {
					var p = cfg.theme_primary, s = cfg.theme_secondary;
					var root = document.documentElement.style;
					var css = '';
					if (p) {
						root.setProperty('--cs-primary', p);
						css +=
							'.u-button--primary,.u-btn--primary{background-color:' + p + '!important;border-color:' + p + '!important;color:#fff!important;}' +
							'.u-button--primary--plain,.u-btn--primary--plain{color:' + p + '!important;border-color:' + p + '!important;background:transparent!important;}' +
							'.u-tag--primary{background-color:' + p + '!important;border-color:' + p + '!important;}' +
							'.u-badge--primary{background-color:' + p + '!important;}' +
							'.u-radio__icon-wrap--checked,.u-checkbox__icon-wrap--checked{background-color:' + p + '!important;border-color:' + p + '!important;}' +
							'.u-switch--on,.u-switch--primary{background-color:' + p + '!important;}' +
							'.u-primary,.u-text-primary,.u-count-to-primary{color:' + p + '!important;}' +
							'.u-tabs__line,.u-line-progress__inner,.u-line-progress--active,.u-slider--active{background-color:' + p + '!important;}' +
							'.u-circle-progress__line{color:' + p + '!important;}' +
							'.u-search__action{color:' + p + '!important;}' +
							'.u-checkbox__icon-wrap--checked,.u-radio__icon-wrap--checked{box-shadow:none!important;}';
					}
					if (s) {
						root.setProperty('--cs-secondary', s);
						css += '.u-button--primary:active,.u-btn--primary:active{background-color:' + s + '!important;}';
					}
					ensureStyle('cs-theme-skin').textContent = css;
				}

				/* ===== 统一应用（供后台实时预览 postMessage 调用） ===== */
				function applyAll(cfg) {
					cfg = cfg || {};
					applyThemeColor(cfg);
					applyBg(cfg);
					applyTabbar(cfg);
					applyBadge(cfg);
					if ('builtin_cs_enabled' in cfg) {
						document.documentElement.setAttribute('data-builtin-cs', String(cfg.builtin_cs_enabled));
					}
					if (loader.style.display !== 'none') {
						if (cfg.loading_name) brand.textContent = cfg.loading_name;
						if (cfg.loading_logo) logo.src = cfg.loading_logo.indexOf('http') === 0 ? cfg.loading_logo : (cfg.loading_logo.charAt(0) === '/' ? '/h5' + cfg.loading_logo : cfg.loading_logo);
					}
				}
				window.__csApply = applyAll;
				window.addEventListener('message', function (e) {
					var d = e.data;
					if (d && d.type === 'cs-preview' && d.config) applyAll(d.config);
				});

				function tick() {
					if (percent >= 100) { percent = 100; update(); finish(); return; }
					var inc = Math.random() * 9 + 3;
					percent = Math.min(100, percent + inc);
					update();
					var idx = Math.min(statuses.length - 1, Math.floor(percent / (100 / statuses.length)));
					st.textContent = statuses[idx];
					step.textContent = Math.floor(percent / (100 / 17)) + '/17';
					setTimeout(tick, 140);
				}
				function update() {
					var p = Math.floor(percent);
					pct.textContent = p + '%';
					bar.style.width = p + '%';
				}
				function finish() {
					st.textContent = '即将进入';
					step.textContent = '17/17';
					setTimeout(function () {
						loader.classList.add('cs-hide');
						setTimeout(function () { loader.style.display = 'none'; }, 450);
					}, 350);
				}

				// 拉取配置（失败则用默认值）
				fetch('/api/index/configure', { cache: 'no-store' })
					.then(function (r) { return r.json(); })
					.then(function (res) { applyAll((res && res.data) || {}); })
					.catch(function () { applyAll({}); });

				// 启动进度动画（预览模式跳过）
				if (!isPreview) {
					tick();
					window.addEventListener('load', function () {
						if (percent < 92) percent = 92;
					});
				}
			})();
		</script>
	</body>
</html>
