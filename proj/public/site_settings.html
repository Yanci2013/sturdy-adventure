<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站点设置 - Logo与名称</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #333; }
  .header { background: linear-gradient(135deg, #FF7A45, #FF9D6E); color: #fff; padding: 24px 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .container { max-width: 800px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .card-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #1a1a1a; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
  .form-item { margin-bottom: 24px; }
  .form-label { font-size: 14px; font-weight: 500; color: #333; margin-bottom: 8px; display: block; }
  .form-desc { font-size: 12px; color: #999; margin-top: 6px; }
  .form-input { width: 100%; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border-color 0.2s; }
  .form-input:focus { outline: none; border-color: #FF7A45; }
  .upload-area { display: flex; align-items: center; gap: 20px; }
  .logo-preview { width: 80px; height: 80px; border-radius: 12px; border: 2px dashed #e0e0e0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fafafa; flex-shrink: 0; }
  .logo-preview img { width: 100%; height: 100%; object-fit: contain; }
  .logo-preview-placeholder { color: #ccc; font-size: 12px; text-align: center; }
  .upload-btn { padding: 10px 20px; background: #FF7A45; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: opacity 0.2s; }
  .upload-btn:hover { opacity: 0.85; }
  .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .file-input { display: none; }
  .save-btn { padding: 12px 40px; background: #FF7A45; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
  .save-btn:hover { opacity: 0.85; }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 6px; color: #fff; font-size: 14px; z-index: 10000; animation: fadeIn 0.3s; }
  .toast.success { background: #4CAF50; }
  .toast.error { background: #F44336; }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>
<div class="header">
  <h1>站点设置</h1>
  <p>配置前端首页左上角显示的 Logo 和站点名称</p>
</div>

<div class="container">
  <div class="card">
    <div class="card-title">基础设置</div>

    <div class="form-item">
      <label class="form-label">站点名称</label>
      <input type="text" class="form-input" id="siteName" placeholder="请输入站点名称">
      <div class="form-desc">显示在前端首页左上角 Logo 旁边的文字</div>
    </div>

    <div class="form-item">
      <label class="form-label">站点 Logo</label>
      <div class="upload-area">
        <div class="logo-preview" id="logoPreview">
          <span class="logo-preview-placeholder">无 Logo</span>
        </div>
        <div>
          <input type="file" class="file-input" id="fileInput" accept="image/*">
          <button class="upload-btn" onclick="document.getElementById('fileInput').click()">上传 Logo</button>
          <div class="form-desc">建议正方形图片，大小不超过 5MB</div>
        </div>
      </div>
    </div>

    <button class="save-btn" id="saveBtn" onclick="saveSettings()">保存设置</button>
  </div>
</div>

<script>
const API_BASE = '';
let currentLogoUrl = '';

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'success');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// 加载当前设置
async function loadSettings() {
  try {
    const res = await fetch(API_BASE + '/api/config/get?name=site_name');
    const data = await res.json();
    if (data.code === 1 && data.data) {
      document.getElementById('siteName').value = data.data.value || '';
    }
  } catch (e) {}
  try {
    const res = await fetch(API_BASE + '/api/config/get?name=site_logo');
    const data = await res.json();
    if (data.code === 1 && data.data) {
      currentLogoUrl = data.data.value || '';
      updateLogoPreview(currentLogoUrl);
    }
  } catch (e) {}
}

function updateLogoPreview(url) {
  const preview = document.getElementById('logoPreview');
  if (url) {
    preview.innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='<span class=\\'logo-preview-placeholder\\'>无 Logo</span>'">`;
  } else {
    preview.innerHTML = '<span class="logo-preview-placeholder">无 Logo</span>';
  }
}

// 文件上传
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showToast('图片大小不能超过 5MB', 'error');
    return;
  }
  const btn = document.querySelector('.upload-btn');
  btn.disabled = true;
  btn.textContent = '上传中...';
  try {
    const formData = new FormData();
    formData.append('file', file);
    const res = await fetch(API_BASE + '/api/config/upload', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.code === 1) {
      currentLogoUrl = data.data.url;
      updateLogoPreview(currentLogoUrl);
      showToast('上传成功', 'success');
    } else {
      showToast(data.msg || '上传失败', 'error');
    }
  } catch (err) {
    showToast('网络错误', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '上传 Logo';
    e.target.value = '';
  }
});

// 保存设置
async function saveSettings() {
  const siteName = document.getElementById('siteName').value.trim();
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    const items = [];
    if (siteName) items.push({ name: 'site_name', value: siteName });
    if (currentLogoUrl) items.push({ name: 'site_logo', value: currentLogoUrl });
    const res = await fetch(API_BASE + '/api/config/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items })
    });
    const data = await res.json();
    if (data.code === 1) {
      showToast('保存成功', 'success');
    } else {
      showToast(data.msg || '保存失败', 'error');
    }
  } catch (e) {
    showToast('网络错误', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '保存设置';
  }
}

loadSettings();
</script>
</body>
</html>
