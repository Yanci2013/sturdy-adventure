<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Audio_url')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-audio_url" data-rule="required" class="form-control" size="50" name="row[audio_url]" type="text" value="{$row.audio_url|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-audio_url" class="btn btn-danger faupload" data-input-id="c-audio_url" data-mimetype="audio/*" data-multiple="false"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-audio_url" class="btn btn-primary fachoose" data-input-id="c-audio_url" data-mimetype="audio/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-audio_url"></span>
            </div>
            <span class="help-block">支持mp3、wav等音频格式</span>
            {notempty name="row.audio_url"}
            <div style="margin-top: 10px;">
                <audio controls style="width: 100%; max-width: 500px;">
                    <source src="{$row.audio_url|cdnurl}" type="audio/mpeg">
                    您的浏览器不支持音频播放
                </audio>
            </div>
            {/notempty}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">音频封面:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image_url" class="form-control" size="50" name="row[image_url]" type="text" value="{$row.image_url|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-image_url" class="btn btn-danger faupload" data-input-id="c-image_url" data-mimetype="image/*" data-multiple="false"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-image_url" class="btn btn-primary fachoose" data-input-id="c-image_url" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-image_url"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-image_url"></ul>
            {notempty name="row.image_url"}
            <div style="margin-top: 10px;">
                <img src="{$row.image_url|cdnurl}" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
            </div>
            {/notempty}
            <span class="help-block">音频播放时显示的封面图，圆形显示</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Sort')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-sort" data-rule="required" class="form-control" name="row[sort]" type="number" value="{$row.sort|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
