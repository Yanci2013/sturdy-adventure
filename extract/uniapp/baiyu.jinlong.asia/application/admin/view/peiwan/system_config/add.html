<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Wxappid')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-wxappid" data-rule="required" class="form-control" name="row[wxappid]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Wxappsecret')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-wxappsecret" data-rule="required" class="form-control" name="row[wxappsecret]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Is_audit')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-is_audit" data-rule="required" class="form-control selectpicker" name="row[is_audit]">
                {foreach name="isAuditList" item="vo"}
                    <option value="{$key}" {in name="key" value="0"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Is_custom_order')}:</label>
        <div class="col-xs-12 col-sm-8">
                        
            <select  id="c-is_custom_order" data-rule="required" class="form-control selectpicker" name="row[is_custom_order]">
                {foreach name="isCustomOrderList" item="vo"}
                    <option value="{$key}" {in name="key" value="0"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
