<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">游戏:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-game_id" data-rule="required" min="0" data-source="peiwan/game/index" data-field="name" class="form-control selectpage" name="row[game_id]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">套餐图片:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image" class="form-control" size="50" name="row[image]" type="text" value="">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-image" class="btn btn-danger faupload" data-input-id="c-image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp" data-multiple="false" data-preview-id="p-image"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-image" class="btn btn-primary fachoose" data-input-id="c-image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-image"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-image"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">套餐规则:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-rule" class="form-control" rows="3" name="row[rule]" cols="50" placeholder="请输入套餐规则说明"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">体验价（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-trial_price" data-rule="required" class="form-control" step="0.01" name="row[trial_price]" type="number" value="0.00">
            <span class="help-block">体验会员的价格</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">体验天数:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-trial_days" data-rule="required" min="0" class="form-control" name="row[trial_days]" type="number" value="0">
            <span class="help-block">体验会员的有效天数</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">正式价格（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-formal_price" data-rule="required" class="form-control" step="0.01" name="row[formal_price]" type="number" value="0.00">
            <span class="help-block">正式会员的价格</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">有效天数:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-valid_days" data-rule="required" min="0" class="form-control" name="row[valid_days]" type="number" value="0">
            <span class="help-block">正式会员的有效天数</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2" style="font-weight: bold; color: #28a745;">体验会员佣金:</label>
        <div class="col-xs-12 col-sm-8"><span class="help-block">用户充值体验会员时的佣金分配</span></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">管事佣金（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-trial_commission_guanshi" data-rule="required" class="form-control" step="0.01" name="row[trial_commission_guanshi]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">组长佣金（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-trial_commission_zuzhang" data-rule="required" class="form-control" step="0.01" name="row[trial_commission_zuzhang]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">总管佣金（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-trial_commission_zongguan" data-rule="required" class="form-control" step="0.01" name="row[trial_commission_zongguan]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2" style="font-weight: bold; color: #007AFF;">首次正式会员佣金:</label>
        <div class="col-xs-12 col-sm-8"><span class="help-block">用户首次充值正式会员时的佣金分配</span></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">管事佣金（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-first_commission_guanshi" data-rule="required" class="form-control" step="0.01" name="row[first_commission_guanshi]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">组长佣金（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-first_commission_zuzhang" data-rule="required" class="form-control" step="0.01" name="row[first_commission_zuzhang]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">总管佣金（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-first_commission_zongguan" data-rule="required" class="form-control" step="0.01" name="row[first_commission_zongguan]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2" style="font-weight: bold; color: #007AFF;">续费正式会员佣金:</label>
        <div class="col-xs-12 col-sm-8"><span class="help-block">用户续费正式会员时的佣金分配</span></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">管事佣金（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-renew_commission_guanshi" data-rule="required" class="form-control" step="0.01" name="row[renew_commission_guanshi]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">组长佣金（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-renew_commission_zuzhang" data-rule="required" class="form-control" step="0.01" name="row[renew_commission_zuzhang]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">总管佣金（元）:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-renew_commission_zongguan" data-rule="required" class="form-control" step="0.01" name="row[renew_commission_zongguan]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="normal"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
