<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('User_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-user_id" data-rule="required" min="0" data-source="user/user/index" data-field="nickname" class="form-control selectpage" name="row[user_id]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">游戏:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-game_id" data-rule="required" class="form-control selectpicker" name="row[game_id]">
                <option value="">请选择游戏</option>
                {foreach name="gameList" item="vo"}
                    <option value="{$vo.id}">{$vo.name}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">会员套餐:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-package_id" data-rule="required" class="form-control selectpicker" name="row[package_id]">
                <option value="">请选择会员套餐</option>
                {foreach name="packageList" item="vo"}
                    <option value="{$vo.id}" data-game-id="{$vo.game_id}" data-trial-days="{$vo.trial_days}" data-valid-days="{$vo.valid_days}">套餐ID: {$vo.id} (游戏ID: {$vo.game_id})</option>
                {/foreach}
            </select>
            <span class="help-block">选择会员套餐后，天数会根据套餐类型自动填充，但可以手动修改</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">会员类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-package_type" data-rule="required" class="form-control selectpicker" name="row[package_type]">
                {foreach name="packageTypeList" item="vo" key="key"}
                    <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">天数:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-days" data-rule="integer" min="1" class="form-control" name="row[days]" type="number" value="" placeholder="请输入天数">
            <span class="help-block">会员有效期天数，选择套餐和类型后会自动填充，也可手动修改</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Start_time')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-start_time" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[start_time]" type="text" value="{:date('Y-m-d H:i:s')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('End_time')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-end_time" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[end_time]" type="text" value="{:date('Y-m-d H:i:s')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="normal"}checked{/in} /> {$vo}</label> 
            {/foreach}
            </div>

        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>

<script>
$(function () {
    // 计算天数（从开始时间和结束时间）
    function calculateDays() {
        var startTime = $('#c-start_time').val();
        var endTime = $('#c-end_time').val();
        if (startTime && endTime) {
            var start = new Date(startTime.replace(/-/g, '/'));
            var end = new Date(endTime.replace(/-/g, '/'));
            if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
                var days = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
                if (days > 0) {
                    $('#c-days').val(days);
                }
            }
        }
    }
    
    // 根据天数计算结束时间
    function calculateEndTime() {
        var startTime = $('#c-start_time').val();
        var days = parseInt($('#c-days').val()) || 0;
        if (startTime && days > 0) {
            var start = new Date(startTime.replace(/-/g, '/'));
            if (!isNaN(start.getTime())) {
                start.setDate(start.getDate() + days);
                var year = start.getFullYear();
                var month = String(start.getMonth() + 1).padStart(2, '0');
                var day = String(start.getDate()).padStart(2, '0');
                var hours = String(start.getHours()).padStart(2, '0');
                var minutes = String(start.getMinutes()).padStart(2, '0');
                var seconds = String(start.getSeconds()).padStart(2, '0');
                var endTimeStr = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
                $('#c-end_time').val(endTimeStr);
            }
        }
    }
    
    // 根据套餐和类型自动填充天数
    function updateDaysFromPackage() {
        var packageId = $('#c-package_id').val();
        var packageType = $('#c-package_type').val();
        if (packageId && packageType) {
            var option = $('#c-package_id option:selected');
            var days = 0;
            if (packageType === 'trial') {
                days = parseInt(option.attr('data-trial-days')) || 0;
            } else if (packageType === 'formal') {
                days = parseInt(option.attr('data-valid-days')) || 0;
            }
            if (days > 0) {
                $('#c-days').val(days);
                // 如果开始时间已设置，自动计算结束时间
                if ($('#c-start_time').val()) {
                    calculateEndTime();
                }
            }
        }
    }
    
    // 监听套餐选择变化
    $('#c-package_id').on('change', function() {
        updateDaysFromPackage();
    });
    
    // 监听类型选择变化
    $('#c-package_type').on('change', function() {
        updateDaysFromPackage();
    });
    
    // 监听天数变化
    $('#c-days').on('change blur', function() {
        if ($('#c-start_time').val()) {
            calculateEndTime();
        }
    });
    
    // 监听开始时间变化
    $('#c-start_time').on('change', function() {
        if ($('#c-days').val()) {
            calculateEndTime();
        } else {
            calculateDays();
        }
    });
    
    // 监听结束时间变化
    $('#c-end_time').on('change', function() {
        calculateDays();
    });
});
</script>
