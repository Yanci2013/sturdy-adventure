<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>H5 构建产物下载</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f5f7fa}
.card{background:#fff;padding:40px 50px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.1);text-align:center;max-width:420px}
h1{color:#333;margin:0 0 10px;font-size:22px}
p{color:#666;margin:5px 0 25px;font-size:14px}
.btn{display:inline-block;padding:14px 40px;background:#3b7cff;color:#fff;text-decoration:none;border-radius:10px;font-size:16px;font-weight:600;transition:.2s;border:none;cursor:pointer}
.btn:hover{background:#2f66d6;transform:translateY(-1px)}
.size{color:#999;font-size:13px;margin-top:15px}
.tip{margin-top:20px;padding:12px;background:#fff8e6;border-radius:8px;color:#8a6d3b;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>H5 前端构建产物</h1>
<p>点击下方按钮下载打包文件</p>
<button class="btn" onclick="startDownload()">下载 h5-build.zip</button>
<div class="size">文件大小：约 11 MB</div>
<div class="tip">如果点击无反应，请右键按钮选择"链接另存为"</div>
</div>
<script>
function startDownload(){
  const a=document.createElement('a');
  a.href='/h5-build.zip';
  a.download='h5-build.zip';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
// 自动触发下载
window.addEventListener('load',function(){setTimeout(startDownload,500)});
</script>
</body>
</html>
