<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('打手')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="form-control-static">
                <img src="{$thug.avatar}" style="width: 40px; height: 40px; border-radius: 50%; vertical-align: middle;" />
                {$thug.name} (ID: {$thug.id})
            </div>
            <input type="hidden" name="row[thug_id]" value="{$row.thug_id}" />
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('选择礼物')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-gift_ids" data-source="gift/selectpage" data-field="name" class="form-control selectpage" name="row[gift_ids]" type="text" value="{$row.gift_ids}" data-multiple="true">
            <span class="help-block">{:__('选择该打手礼物墙上显示的礼物，不选则显示所有启用礼物')}</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('状态')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" class="form-control selectpicker" name="row[status]">
                <option value="1" {if $row.status == 1}selected{/if}>{:__('启用')}</option>
                <option value="0" {if $row.status == 0}selected{/if}>{:__('禁用')}</option>
            </select>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('Submit')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
