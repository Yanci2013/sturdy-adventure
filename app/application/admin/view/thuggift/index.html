<div class="panel panel-default panel-intro">
    {:build_heading()}
    <div class="panel-heading">
        <div class="panel-lead"><em>管理礼物墙配置</em></div>
        <ul class="nav nav-tabs">
            <li class="active"><a href="#tab1" data-toggle="tab">礼物墙配置列表</a></li>
            <li><a href="javascript:;" onclick="location.href='records'" title="查看赠送记录"><i class="fa fa-list"></i> 赠送记录</a></li>
            <li><a href="javascript:;" onclick="location.href='stats'" title="查看统计"><i class="fa fa-bar-chart"></i> 礼物统计</a></li>
        </ul>
    </div>
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="tab1">
                <div class="toolbar">
                    <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
                    <a href="javascript:;" class="btn btn-warning btn-global" title="全局配置"><i class="fa fa-globe"></i> 全局配置</a>
                    <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('thuggift/add')?'':'hide'}" title="{:__('Add')}"><i class="fa fa-plus"></i> 单独配置</a>
                    <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('thuggift/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> 编辑</a>
                    <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('thuggift/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> 删除</a>
                </div>
                <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                       data-operate-edit="{:$auth->check('thuggift/edit')}"
                       data-operate-del="{:$auth->check('thuggift/del')}"
                       width="100%">
                </table>
            </div>
        </div>
    </div>
</div>
