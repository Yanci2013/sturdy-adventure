<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创世网络 · 后台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;background:#f4f6f8;color:#1f2937}
:root{--accent:#22c55e;--accent-d:#16a34a;--sidebar:#1f2937;--sidebar-2:#111827;--line:#e5e7eb;--muted:#6b7280}
a{color:inherit;text-decoration:none}
/* 登录 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#0f172a 0%,#134e4a 60%,#22c55e 140%);padding:24px}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:40px 34px;
 box-shadow:0 24px 60px rgba(0,0,0,.28)}
.login-card .logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#22c55e,#16a34a);
 margin:0 auto 18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:800}
.login-card h1{text-align:center;font-size:22px;margin-bottom:6px}
.login-card p.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:#374151;margin-bottom:7px}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:14px;outline:none;transition:.2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:14px;outline:none;background:#fff}
.field textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit;resize:vertical}
.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;
 border:none;border-radius:10px;font-size:14px;cursor:pointer;transition:.15s;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-d)}
.btn-block{width:100%;height:48px;font-size:15px;font-weight:600}
.btn-ghost{background:#fff;border:1px solid var(--line);color:#374151}
.btn-ghost:hover{border-color:#cbd5e1;background:#f8fafc}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.btn-danger:hover{background:#fee2e2}
.login-tip{margin-top:16px;text-align:center;font-size:12px;color:#9ca3af}
.err{background:#fef2f2;color:#dc2626;font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none}
/* 布局 */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:224px;background:var(--sidebar);color:#cbd5e1;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:60;transition:transform .22s ease}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 18px;border-bottom:1px solid #2b3648}
.sidebar .brand .b{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#22c55e,#16a34a);
 display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.sidebar .brand .t{color:#fff;font-size:15px;font-weight:700;line-height:1.2}
.sidebar .brand .t span{display:block;font-size:11px;color:#64748b;font-weight:400}
.menu{padding:10px 0}
.menu .sec{padding:12px 18px 6px;font-size:11px;color:#64748b;letter-spacing:.06em}
.menu a{display:flex;align-items:center;gap:11px;padding:11px 18px;font-size:14px;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent}
.menu a:hover{background:#273244;color:#fff}
.menu a.active{background:#273244;color:#fff;border-left-color:var(--accent)}
.menu a .ic{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex:0 0 18px}
.menu a .ic svg{width:17px;height:17px;display:block}
.menu a.sub{padding-left:46px;font-size:13px;color:#94a3b8}
.menu a.sub:hover{color:#fff}
.menu a.sub.active{color:#fff}
.menu .grp .grp-hd{display:flex;align-items:center;gap:11px;padding:11px 18px;font-size:14px;color:#cbd5e1;cursor:pointer}
.menu .grp .grp-hd:hover{background:#273244;color:#fff}
.menu .grp .grp-hd .caret{margin-left:auto;font-size:11px;color:#64748b;transition:transform .2s}
.menu .grp.open .grp-hd .caret{transform:rotate(180deg)}
.menu .grp-bd{background:#0f172a}
.main{flex:1;margin-left:224px;display:flex;flex-direction:column;min-width:0;transition:margin-left .22s ease}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
 justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:40}
.topbar .tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.sidebar-toggle{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;
 display:flex;align-items:center;justify-content:center;cursor:pointer;color:#374151;flex-shrink:0;transition:.15s}
.sidebar-toggle:hover{background:#f8fafc;border-color:#cbd5e1;color:#111827}
.sidebar-toggle svg{width:20px;height:20px;display:block}
.sidebar-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55}
/* 折叠 / 展开 */
body.sidebar-collapsed .sidebar{transform:translateX(-100%)}
body.sidebar-collapsed .main{margin-left:0}
.topbar h1{font-size:16px;font-weight:600}
.topbar .right{display:flex;align-items:center;gap:14px;font-size:13px;color:#374151}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.content{padding:20px 22px;flex:1}
/* 卡片/表格 */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.stat .l{font-size:13px;color:var(--muted);margin-bottom:8px}
.stat .v{font-size:26px;font-weight:700;color:#111827}
.stat .v.green{color:var(--accent-d)}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.06);overflow:hidden;margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-head h2{font-size:15px;font-weight:600}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:13px;outline:none;font-family:inherit}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid #f1f5f9;white-space:nowrap}
th{background:#f8fafc;color:#64748b;font-weight:600;font-size:12px}
tbody tr:hover{background:#f8fafc}
td .muted{color:var(--muted);font-size:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500}
.tag.green{background:#dcfce7;color:#15803d}
.tag.gray{background:#f1f5f9;color:#64748b}
.tag.orange{background:#ffedd5;color:#c2410c}
.tag.red{background:#fee2e2;color:#b91c1c}
.tag.blue{background:#dbeafe;color:#1d4ed8}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto;margin-right:8px}
.switch input{display:none}
.switch .slider{position:absolute;inset:0;background:#cbd5e1;border-radius:20px;transition:.2s;cursor:pointer}
.switch .slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider:before{transform:translateX(20px)}
.empty{padding:46px 0;text-align:center;color:#9ca3af;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .tab{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;color:#64748b;background:#f1f5f9}
.tabs .tab.active{background:var(--accent);color:#fff}
.row-img{width:30px;height:30px;border-radius:8px;object-fit:cover;background:#f1f5f9;vertical-align:middle}
/* 配置 */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;padding:6px}
.cfg-item{border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.cfg-item label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.cfg-item .tip{font-size:12px;color:#9ca3af;margin-bottom:9px}
.cfg-item input[type=text],.cfg-item input[type=password],.cfg-item input[type=number],.cfg-item textarea{
 width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 11px;font-size:13px;outline:none;font-family:inherit}
.cfg-item textarea{height:auto;min-height:70px;padding:8px 11px;resize:vertical}
.cfg-item input:focus,.cfg-item textarea:focus{border-color:var(--accent)}
.cfg-item select{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 11px;font-size:13px;background:#fff}
.chk{display:flex;flex-wrap:wrap;gap:8px 16px}
.chk label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:13px;margin:0}
/* 预览 */
.preview-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dev-btns{display:flex;gap:6px;flex-wrap:wrap}
.dev-btn{padding:7px 15px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;cursor:pointer}
.dev-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.phone-wrap{display:flex;justify-content:center;padding:14px 0 30px}
.phone{border:12px solid #111827;border-radius:40px;background:#111827;box-shadow:0 22px 60px rgba(0,0,0,.3);position:relative}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:22px;background:#111827;border-radius:12px;z-index:2}
.phone iframe{display:block;border:0;background:#fff;border-radius:28px;width:100%;height:100%}
.pv-url{flex:1;min-width:200px;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:13px;background:#fff;color:#374151;font-family:monospace}
/* 前端装修 */
.deco-layout{display:grid;grid-template-columns:1fr 420px;gap:18px;align-items:start}
@media(max-width:1100px){.deco-layout{grid-template-columns:1fr}}
.preset-list{display:flex;gap:10px;flex-wrap:wrap}
.preset{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13px;background:#fff;transition:.15s;position:relative}
.preset:hover{border-color:var(--accent)}
.preset-dot{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--pc),var(--pc2));border:2px solid #fff;box-shadow:0 0 0 1px #e5e7eb}
.preset-check{color:var(--accent-d);font-weight:700}
.color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.color-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fafafa}
.color-row label{font-size:12px;color:#6b7280;width:90px;flex-shrink:0}
.color-input{display:flex;align-items:center;gap:8px;flex:1}
.color-input input[type=color]{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:2px;background:#fff}
.color-input input[type=text]{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:12px;font-family:monospace;outline:none;width:100%}
.color-input input[type=text]:focus{border-color:var(--accent)}
.color-row > input[type=text]{flex:1;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:12px;outline:none}
.color-row > input[type=text]:focus{border-color:var(--accent)}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px}
.modal-head .x{cursor:pointer;font-size:22px;color:#9ca3af;line-height:1}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
 padding:10px 20px;border-radius:10px;font-size:13px;z-index:300;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;top:26px}
@media(max-width:900px){
  .main{margin-left:0}
  .sidebar{box-shadow:0 10px 40px rgba(0,0,0,.3)}
  body:not(.sidebar-collapsed) .sidebar-mask{display:block}
}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="login-card">
    <div class="logo">创</div>
    <h1>创世网络 · 后台管理</h1>
    <p class="sub">自定义后台 UI · 基于 yylAdmin 框架</p>
    <div class="err" id="loginErr"></div>
    <div class="field"><label>管理员账号</label><input id="username" placeholder="请输入账号" value="yyladmin" autocomplete="username"></div>
    <div class="field"><label>登录密码</label><input id="password" type="password" placeholder="请输入密码" value="123456" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" id="loginBtn">登 录</button>
    <div class="login-tip">默认账号 yyladmin / 123456 ，登录鉴权由 yylAdmin 后台框架提供</div>
  </div>
</div>

<!-- 后台主体 -->
<div id="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="b">创</div><div class="t">创世网络<span>前台装修 · 后台管理</span></div></div>
      <nav class="menu" id="menu"></nav>
    </aside>
    <div class="sidebar-mask" id="sidebarMask" onclick="toggleSidebar()"></div>
    <div class="main">
      <div class="topbar">
        <div class="tb-left">
          <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="折叠 / 展开菜单">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h1 id="pageTitle">控制台</h1>
        </div>
        <div class="right">
          <span id="adminName">加载中…</span>
          <div class="avatar" id="adminAvatar">A</div>
          <button class="btn btn-ghost btn-sm" onclick="logout()">退出登录</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div class="modal-mask" id="modal"><div class="modal">
  <div class="modal-head"><h3 id="modalTitle">编辑</h3><div class="x" onclick="closeModal()">×</div></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot" id="modalFoot"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ============ 基础工具 ============ */
const $ = (s, r) => (r || document).querySelector(s)
const state = { token: '', uid: '', menus: [], page: 'dashboard', cache: {} }

function toast(msg, ok = true) {
  const t = $('#toast'); t.textContent = msg
  t.style.background = ok ? '#111827' : '#dc2626'
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800)
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
function fmtTime(v) {
  if (!v) return '-'
  if (typeof v === 'number' || /^\d{9,}$/.test(String(v))) {
    const d = new Date(Number(v) * (String(v).length > 10 ? 1 : 1000))
    return d.toLocaleString('zh-CN', { hour12: false })
  }
  return String(v)
}
const SVG_ATTRS = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"'
const ICONS = {
  dashboard: `<svg ${SVG_ATTRS}><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>`,
  preview: `<svg ${SVG_ATTRS}><rect x="6.5" y="2" width="11" height="20" rx="2.5"/><line x1="11" y1="18.5" x2="13" y2="18.5"/></svg>`,
  users: `<svg ${SVG_ATTRS}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  thugs: `<svg ${SVG_ATTRS}><rect x="2" y="6" width="20" height="12" rx="5"/><line x1="6.5" y1="12" x2="10.5" y2="12"/><line x1="8.5" y1="10" x2="8.5" y2="14"/><line x1="15.5" y1="13" x2="15.51" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>`,
  cs: `<svg ${SVG_ATTRS}><path d="M3 16v-4a9 9 0 0 1 18 0v4"/><path d="M21 16a2 2 0 0 1-2 2h-1a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h3zM3 16a2 2 0 0 0 2 2h1a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1H3z"/></svg>`,
  orders: `<svg ${SVG_ATTRS}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8.5" y1="13" x2="15.5" y2="13"/><line x1="8.5" y1="17" x2="13" y2="17"/></svg>`,
  notices: `<svg ${SVG_ATTRS}><path d="M4 10v4a1 1 0 0 0 1 1h2l4 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M16 8.5a4 4 0 0 1 0 7"/></svg>`,
  invites: `<svg ${SVG_ATTRS}><path d="M2 9a3 3 0 0 1 0 6v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a3 3 0 0 1 0-6V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><line x1="13.5" y1="6" x2="13.5" y2="18" stroke-dasharray="2 2.4"/></svg>`,
  config: `<svg ${SVG_ATTRS}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  logs: `<svg ${SVG_ATTRS}><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>`,

/* ============ API ============ */
async function yyl(path, body) {
  const opt = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' } }
  if (state.token) { opt.headers['AdminToken'] = state.token; opt.headers['AdminUserId'] = state.uid }
  if (body) opt.body = JSON.stringify(body)
  const r = await fetch('/yyl' + path, opt)
  return r.json()
}
async function biz(path, body) {
  const opt = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' } }
  if (body) opt.body = JSON.stringify(body)
  const r = await fetch('/api/admin/' + path, opt)
  return r.json()
}

/* ============ 登录 ============ */
$('#loginBtn').onclick = doLogin
;['username', 'password'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() }))

async function doLogin() {
  const username = $('#username').value.trim(), password = $('#password').value
  const err = $('#loginErr'); err.style.display = 'none'
  if (!username || !password) { err.textContent = '请输入账号和密码'; err.style.display = 'block'; return }
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = '登录中…'
  try {
    const res = await yyl('/admin/AdminLogin/login', { username, password })
    if (res.code === 200 || res.code === 1) {
      state.token = res.data.admin_token; state.uid = res.data.admin_user_id
      sessionStorage.setItem('admin_token', state.token); sessionStorage.setItem('admin_uid', state.uid)
      enterApp()
    } else { err.textContent = res.msg || '登录失败'; err.style.display = 'block' }
  } catch (e) { err.textContent = '无法连接后台框架（yylAdmin）: ' + e.message; err.style.display = 'block' }
  finally { btn.disabled = false; btn.textContent = '登 录' }
}
function logout() {
  yyl('/admin/AdminLogin/logout', {}).catch(() => { })
  sessionStorage.clear(); state.token = ''; state.uid = ''
  $('#app').style.display = 'none'; $('#login').style.display = 'flex'
}

function flatMenus() {
  const out = []
  MENUS.forEach(m => { if (m.key) out.push(m); else (m.children || []).forEach(c => out.push(c)) })
  return out
}
function renderMenu() {
  const html = MENUS.map(m => {
    if (m.key) {
      return `<a data-key="${m.key}" class="${state.page === m.key ? 'active' : ''}" onclick="go('${m.key}')"><span class="ic">${icon(m.key)}</span>${esc(m.name)}</a>`
    }
    const open = openGroups.has(m.group)
    const items = (m.children || []).map(c =>
      `<a data-key="${c.key}" class="sub ${state.page === c.key ? 'active' : ''}" onclick="go('${c.key}')"><span class="ic">${icon(c.key)}</span>${esc(c.name)}</a>`
    ).join('')
    return `<div class="grp ${open ? 'open' : ''}" onclick="toggleGroup('${m.group}')">
      <div class="grp-hd"><span class="ic">${icon(m.group)}</span>${esc(m.group)}<span class="caret">▾</span></div>
      ${open ? `<div class="grp-bd">${items}</div>` : ''}
    </div>`
  }).join('')
  $('#menu').innerHTML = html
}
function toggleGroup(name) {
  if (openGroups.has(name)) openGroups.delete(name); else openGroups.add(name)
  renderMenu()
}

/* ============ 侧边栏折叠/展开 ============ */
const MOBILE_BP = 900
function isMobile() { return window.innerWidth <= MOBILE_BP }
function toggleSidebar() {
  const collapsed = document.body.classList.toggle('sidebar-collapsed')
  if (!isMobile()) localStorage.setItem('admin_sidebar_collapsed', collapsed ? '1' : '0')
}
function initSidebar() {
  // 移动端默认收起；桌面端读取上次记忆的状态
  if (isMobile()) document.body.classList.add('sidebar-collapsed')
  else if (localStorage.getItem('admin_sidebar_collapsed') === '1') document.body.classList.add('sidebar-collapsed')
}
window.addEventListener('resize', () => {
  // 切换回桌面端时恢复默认（不保留移动端临时收起态）
  if (!isMobile() && !localStorage.getItem('admin_sidebar_collapsed')) document.body.classList.remove('sidebar-collapsed')
})

  state.page = key
  renderMenu()

  const box = $('#content')

  ;(PAGES[key] || crudPage(key))()
}

let thugFilter = ''
PAGES.thugs = async () => {
  const r = await biz(`thugs?sh_status=${thugFilter}`)
  const list = (r.data || {}).list || []
  window.__thugMap = {}
  list.forEach(t => { window.__thugMap[t.id] = t })
  const rows = list.map(t => {
    const st = String(t.sh_status)
    const tag = st === '1' ? '<span class="tag green">已通过</span>' : st === '2' ? '<span class="tag red">已驳回</span>' : '<span class="tag orange">待审核</span>'
    const rn = rnTag(t.realname_status)
    return `<tr>
      <td>${esc(t.id)}</td>
      <td>${esc(t.name || '-')}</td>
      <td>${esc(t.user_nickname || ('用户#' + t.user_id))}</td>
      <td>${tag}</td>
      <td>${rn}</td>
      <td>${t.is_customer_service == 1 ? '<span class="tag blue">客服权限</span>' : '<span class="tag gray">普通打手</span>'}</td>
      <td class="muted">${fmtTime(t.createtime)}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="thugViewRealname(${t.id})">认证信息</button>
        ${st !== '1' ? `<button class="btn btn-ghost btn-sm" onclick="thugAudit(${t.id},'approve')">通过</button>` : ''}
        ${st !== '2' ? `<button class="btn btn-ghost btn-sm" onclick="thugAudit(${t.id},'reject')">驳回</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="thugToggleCs(${t.id},${t.is_customer_service == 1 ? 0 : 1})">${t.is_customer_service == 1 ? '取消客服' : '设为客服'}</button>
        <button class="btn btn-danger btn-sm" onclick="thugDel(${t.id})">删除</button>
      </td></tr>`
  }).join('')
  $('#content').innerHTML = `<div class="card">
    <div class="card-head"><h2>打手管理 <span class="muted">共 ${list.length} 条</span></h2>
      <div class="tabs">
        ${[['', '全部'], ['0', '待审核'], ['1', '已通过'], ['2', '已驳回']].map(t => `<div class="tab ${thugFilter === t[0] ? 'active' : ''}" onclick="thugSet('${t[0]}')">${t[1]}</div>`).join('')}
      </div></div>
    <table><thead><tr><th>ID</th><th>打手名</th><th>所属用户</th><th>审核状态</th><th>实名认证</th><th>客服权限</th><th>申请时间</th><th>操作</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8"><div class="empty">暂无打手数据</div></td></tr>'}</tbody></table></div>`
}
function rnTag(s) {
  s = Number(s || 0)
  if (s === 2) return '<span class="tag green">已认证</span>'
  if (s === 1) return '<span class="tag orange">待审核</span>'
  if (s === 3) return '<span class="tag red">已驳回</span>'
  return '<span class="tag gray">未提交</span>'
}
function thugViewRealname(id) {
  const t = (window.__thugMap || {})[id] || {}
  const img = (u) => u ? `<img src="${esc(u)}" style="width:100%;border-radius:8px;border:1px solid var(--line)" />` : '<div class="muted">未上传</div>'
  const body = `
    <div style="display:grid;gap:14px">
      <div><label class="muted">真实姓名</label><div style="font-weight:600;margin-top:4px">${esc(t.real_name || '-')}</div></div>
      <div><label class="muted">身份证号</label><div style="font-weight:600;margin-top:4px">${esc(t.id_card || '-')}</div></div>
      ${t.realname_reason ? `<div><label class="muted">驳回原因</label><div style="color:#b91c1c;margin-top:4px">${esc(t.realname_reason)}</div></div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label class="muted">身份证正面</label><div style="margin-top:6px">${img(t.realname_front)}</div></div>
        <div><label class="muted">身份证反面</label><div style="margin-top:6px">${img(t.realname_back)}</div></div>
      </div>
    </div>`
  const buttons = []
  if (Number(t.realname_status) !== 2) buttons.push({ text: '通过认证', cls: 'btn-primary', fn: () => realnameAudit(id, 'approve') })
  if (Number(t.realname_status) !== 3) buttons.push({ text: '驳回', fn: () => { closeModal(); realnameReject(id) } })
  buttons.push({ text: '关闭', fn: closeModal })
  openModal('实名认证信息', body, buttons)
}
async function realnameAudit(id, action) {
  const r = await biz('realname/audit', { id, action })
  toast(r.msg); closeModal(); PAGES.thugs()
}
function realnameReject(id) {
  const reason = prompt('请输入驳回原因', '证件照片不清晰')
  if (reason === null) return
  realnameAudit2(id, reason)
}
async function realnameAudit2(id, reason) {
  const r = await biz('realname/audit', { id, action: 'reject', reason })
  toast(r.msg); PAGES.thugs()
}
function thugSet(v) { thugFilter = v; PAGES.thugs() }
async function thugAudit(id, action) {
  const r = await biz('thug/audit', { id, action }); toast(r.msg); PAGES.thugs()
}
async function thugToggleCs(id, v) {
  const r = await biz('thug/audit', { id, action: 'toggle_cs', is_customer_service: !!v }); toast(r.msg); PAGES.thugs()
}
function thugDel(id) { confirmModal('删除打手', '确定删除该打手？此操作不可恢复。', async () => { const r = await biz('thug/audit', { id, action: 'delete' }); toast(r.msg); PAGES.thugs() }) }

let orderQuery = { keyword: '', status: '', page: 1, limit: 20 }
const ORDER_ST = { '0': ['待付款', 'orange'], '1': ['待接单', 'blue'], '2': ['服务中', 'blue'], '3': ['待结单', 'orange'], '4': ['售后中', 'red'], '5': ['已完成', 'green'] }

  const r = await biz(`orders?keyword=${encodeURIComponent(orderQuery.keyword)}&status=${orderQuery.status}&page=${orderQuery.page}&limit=${orderQuery.limit}`)
  const d = r.data || { list: [], total: 0 }
  const rows = d.list.map(o => {
    const st = ORDER_ST[String(o.status)] || ['未知', 'gray']
    return `<tr>

      <td>${esc(o.title || '-')}</td>

      <td><button class="btn btn-ghost btn-sm" onclick="orderEdit(${o.id},${o.status})">改状态</button></td></tr>`
  }).join('')
  $('#content').innerHTML = `<div class="card">
    <div class="card-head"><h2>订单管理 <span class="muted">共 ${d.total} 条</span></h2>
      <div class="toolbar">
        <div class="tabs">${[['', '全部'], ['0', '待付款'], ['1', '待接单'], ['2', '服务中'], ['3', '待结单'], ['4', '售后中'], ['5', '已完成']].map(t => `<div class="tab ${orderQuery.status === t[0] ? 'active' : ''}" onclick="orderSet('${t[0]}')">${t[1]}</div>`).join('')}</div>
        <input id="okw" placeholder="订单号 / 商品 / 游戏ID" value="${esc(orderQuery.keyword)}">
        <button class="btn btn-primary btn-sm" onclick="orderSearch()">搜索</button>

    <table><thead><tr><th>订单号</th><th>商品</th><th>游戏ID</th><th>金额</th><th>状态</th><th>下单时间</th><th>操作</th></tr></thead>

function orderEdit(id, status) {

/* ============ 系统配置 ============ */
let cfgGroup = 'basic'
const GROUPS = [['basic', '基础配置'], ['ulogin', '聚合登录'], ['rainbow_epay', '彩虹易支付']]
PAGES.config = async () => {
  const r = await biz(`configs?group=${cfgGroup}`)
  // configgroup 为分组元数据（存的是分组字典 JSON），不作为可编辑项展示
  const list = ((r.data || {}).list || []).filter(c => c.name !== 'configgroup')
  const items = list.map(c => {
    const v = c.value || ''
    let input = ''
    if (c.type === 'radio') {
      const opts = JSON.parse(c.content || '{}')
      input = `<select data-name="${esc(c.name)}">${Object.keys(opts).map(k => `<option value="${esc(k)}" ${v === k ? 'selected' : ''}>${esc(opts[k])}</option>`).join('')}</select>`
    } else if (c.type === 'checkbox') {
      const opts = JSON.parse(c.content || '{}'); const cur = v.split(',').filter(Boolean)
      input = `<div class="chk" data-name="${esc(c.name)}">${Object.keys(opts).map(k => `<label><input type="checkbox" value="${esc(k)}" ${cur.includes(k) ? 'checked' : ''}>${esc(opts[k])}</label>`).join('')}</div>`
    } else if (c.type === 'password') {
      input = `<input type="password" data-name="${esc(c.name)}" value="${esc(v)}">`
    } else if (c.type === 'images') {
      input = `<input type="text" data-name="${esc(c.name)}" value="${esc(v)}" placeholder="图片地址，多个用逗号分隔">`
    } else {
      input = `<input type="text" data-name="${esc(c.name)}" value="${esc(v)}">`
    }
    return `<div class="cfg-item"><label>${esc(c.title)}</label>${c.tip ? `<div class="tip">${esc(c.tip)}</div>` : ''}${input}</div>`
  }).join('')
  $('#content').innerHTML = `<div class="card">
    <div class="card-head"><h2>系统配置</h2>
      <div class="tabs">${GROUPS.map(g => `<div class="tab ${cfgGroup === g[0] ? 'active' : ''}" onclick="cfgSet('${g[0]}')">${g[1]}</div>`).join('')}</div>
      <button class="btn btn-primary btn-sm" onclick="cfgSave()">保存配置</button></div>
    <div class="form-grid">${items || '<div class="empty">该分组暂无配置项</div>'}</div></div>`
}
function cfgSet(g) { cfgGroup = g; PAGES.config() }
async function cfgSave() {
  const items = {}
  document.querySelectorAll('[data-name]').forEach(el => {
    const name = el.dataset.name
    if (el.classList.contains('chk')) {
      items[name] = [...el.querySelectorAll('input:checked')].map(i => i.value).join(',')
    } else if (el.tagName === 'SELECT') {
      items[name] = el.value
    } else {
      items[name] = el.value
    }
  })
  const r = await biz('config/save', { items }); toast(r.msg)
}

state.resDefs = null
const resQuery = {}
const resCache = {}
function resField(spec, k) { return (spec.fields || []).find(f => f.key === k) || { key: k, label: k, type: 'text' } }
async function ensureDefs() {
  if (state.resDefs) return state.resDefs
  const r = await biz('resource/defs')
  state.resDefs = (r.data || {}).defs || {}
  return state.resDefs
}
function resCell(spec, k, val) {
  const f = resField(spec, k)
  if (f.type === 'select') return `<span class="tag blue">${esc((f.options || {})[String(val)] || val || '-')}</span>`
  if (f.type === 'switch') return val == '1' ? '<span class="tag green">启用</span>' : '<span class="tag gray">停用</span>'
  if (f.type === 'textarea') return `<span class="muted">${esc(String(val || '').slice(0, 28))}</span>`
  if (/logo|image|icon|avatar|图片|封面/i.test(k) && val) return `<img class="row-img" src="${esc(val)}" onerror="this.style.visibility='hidden'">`
  return esc(val == null || val === '' ? '-' : val)
}
function resFormHtml(spec, item) {
  return (spec.fields || []).map(f => {
    const v = item && item[f.key] != null ? item[f.key] : ''
    let input
    if (f.type === 'select') {
      input = `<select id="rf_${f.key}">${Object.keys(f.options || {}).map(o => `<option value="${esc(o)}" ${String(v) === o ? 'selected' : ''}>${esc(f.options[o])}</option>`).join('')}</select>`
    } else if (f.type === 'textarea') {
      input = `<textarea id="rf_${f.key}">${esc(v)}</textarea>`
    } else if (f.type === 'switch') {
      input = `<label class="switch"><input type="checkbox" id="rf_${f.key}" ${v == '1' ? 'checked' : ''}><span class="slider"></span></label>`
    } else {
      input = `<input id="rf_${f.key}" type="${f.type === 'number' ? 'number' : 'text'}" value="${esc(v)}">`
    }
    return `<div class="field"><label>${esc(f.label)}</label>${input}</div>`
  }).join('')
}
function resCollect(spec) {
  const data = {}
  ;(spec.fields || []).forEach(f => {
    const el = $('#rf_' + f.key)
    if (!el) return
    data[f.key] = f.type === 'switch' ? (el.checked ? '1' : '0') : el.value
  })
  return data
}
async function renderResourceList(key, spec) {
  const qy = resQuery[key] || (resQuery[key] = { keyword: '', page: 1, limit: 20 })
  const r = await biz(`resource?res=${key}&keyword=${encodeURIComponent(qy.keyword)}&page=${qy.page}&limit=${qy.limit}`)
  const d = r.data || { list: [], total: 0 }
  resCache[key] = d.list || []
  const cols = spec.columns || (spec.fields || []).map(f => f.key)
  const rows = resCache[key].map(it => `<tr>
    <td>${esc(it.id)}</td>
    ${cols.map(c => `<td>${resCell(spec, c, it[c])}</td>`).join('')}
    <td>
      <button class="btn btn-ghost btn-sm" onclick="resEdit('${key}',${it.id})">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="resDel('${key}',${it.id})">删除</button>
    </td></tr>`).join('')
  const totalPages = Math.max(1, Math.ceil((d.total || 0) / qy.limit))
  $('#content').innerHTML = `<div class="card">
    <div class="card-head"><h2>${esc(spec.title || key)} <span class="muted">共 ${d.total} 条</span></h2>
      <div class="toolbar">
        ${spec.search ? `<input id="rkw" placeholder="搜索 ${esc((spec.search || []).map(c => resField(spec, c).label).join('/'))}" value="${esc(qy.keyword)}"><button class="btn btn-primary btn-sm" onclick="resSearch('${key}')">搜索</button>` : ''}
        <button class="btn btn-primary btn-sm" onclick="resEdit('${key}',0)">+ 新增</button>
      </div></div>
    <table><thead><tr><th>ID</th>${cols.map(c => `<th>${esc(resField(spec, c).label)}</th>`).join('')}<th>操作</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="${cols.length + 2}"><div class="empty">暂无数据</div></td></tr>`}</tbody></table>
    <div class="toolbar" style="justify-content:flex-end;margin-top:14px">
      <button class="btn btn-ghost btn-sm" ${qy.page <= 1 ? 'disabled' : ''} onclick="resPage('${key}',${qy.page - 1})">上一页</button>
      <span class="muted" style="font-size:13px">${qy.page} / ${totalPages}</span>
      <button class="btn btn-ghost btn-sm" ${qy.page >= totalPages ? 'disabled' : ''} onclick="resPage('${key}',${qy.page + 1})">下一页</button>
    </div></div>`
  const kw = $('#rkw')
  if (kw) kw.addEventListener('keydown', e => { if (e.key === 'Enter') resSearch(key) })
}
async function renderResourceForm(key, spec) {
  const r = await biz(`resource?res=${key}`)
  const item = (r.data || {}).item || {}
  $('#content').innerHTML = `<div class="card">
    <div class="card-head"><h2>${esc(spec.title || key)}</h2></div>
    <div class="form-grid">${resFormHtml(spec, item)}</div>
    <div style="margin-top:18px"><button class="btn btn-primary" onclick="resSave('${key}',1)">保存配置</button></div></div>`
}
function resSearch(key) { const q = resQuery[key] || (resQuery[key] = { keyword: '', page: 1, limit: 20 }); q.keyword = $('#rkw').value.trim(); q.page = 1; PAGES[key]() }
function resPage(key, p) { const q = resQuery[key] || (resQuery[key] = { keyword: '', page: 1, limit: 20 }); if (p < 1) return; q.page = p; PAGES[key]() }
async function resEdit(key, id) {
  const spec = state.resDefs[key]
  const item = id ? (resCache[key] || []).find(x => Number(x.id) === Number(id)) : null
  openModal((id ? '编辑' : '新增') + (spec.title || ''), resFormHtml(spec, item || {}),
    [{ text: '保存', cls: 'btn-primary', fn: () => resSave(key, id) }])
}
async function resSave(key, id) {
  const spec = state.resDefs[key]
  const data = Object.assign({ res: key, id: id || 0 }, resCollect(spec))
  const r = await biz('resource/save', data)
  closeModal(); toast(r.msg); PAGES[key]()
}
function resDel(key, id) {
  const spec = state.resDefs[key]
  confirmModal('删除' + (spec.title || ''), '确定删除该条数据？删除后不可恢复。', async () => {
    const r = await biz('resource/delete', { res: key, id })
    toast(r.msg); PAGES[key]()
  })
}
function crudPage(key) {
  return async () => {
    $('#content').innerHTML = '<div class="empty">加载中…</div>'
    await ensureDefs()
    const spec = state.resDefs[key]
    if (!spec) { placeholderPage(key)(); return }
    if (spec.singleton) await renderResourceForm(key, spec)
    else await renderResourceList(key, spec)
  }
}

function applyPreset(name) {

}
function setColor(key, val) {

  livePreview()
}
function setPgType(v) {
  decoCfg.page_bg_type = v
  decoCfg.name = '自定义'

  renderDecoration(); livePreview()
}
function setPgSolid(v) {
  decoCfg.colors.page_bg = v
  decoCfg.page_bg_type = 'solid'

function setPgGrad(which, v) {
  if (which === 'from') decoCfg.page_bg_from = v; else decoCfg.page_bg_to = v
  decoCfg.page_bg_type = 'gradient'

function resetBgColor() {
  decoCfg.page_bg_type = 'solid'
  decoCfg.colors.page_bg = '#FFFFFF'

  decoCfg.page_bg_to = '#FFFFFF'

function livePreview() {
  const f = $('#decoFrame')
  if (!f || !f.contentWindow) return
  try {
    const cw = f.contentWindow
    // 优先调用 iframe 内注入的主题应用函数
    if (typeof cw.__applyTheme === 'function') {
      cw.__applyTheme(decoCfg)
    }
    // 兜底：直接操作 iframe DOM，确保背景色等关键变量即时生效
    const doc = f.contentDocument
    if (doc) {
      const root = doc.documentElement
      Object.keys(decoCfg.colors).forEach(k => root.style.setProperty('--theme-' + k, decoCfg.colors[k]))
      let pageBg
      if (decoCfg.bg_image) pageBg = 'url(' + decoCfg.bg_image + ') center/cover no-repeat fixed'
      else if (decoCfg.page_bg_type === 'gradient') pageBg = 'linear-gradient(' + (decoCfg.page_bg_deg || 180) + 'deg,' + (decoCfg.page_bg_from || '#fff') + ' 0%,' + (decoCfg.page_bg_to || '#fff') + ' 100%) fixed'
      else pageBg = (decoCfg.colors.page_bg || '#FFFFFF') + ' fixed'
      ;['html','body','#app','.uni-page-wrapper','.uni-page-body'].forEach(sel => {
        doc.querySelectorAll(sel).forEach(el => { el.style.setProperty('background', pageBg, 'important') })
      })
    }
  } catch (e) { /* 跨域忽略 */ }
}

  const r = await biz('realname/config/save', { enabled: v })
  toast(r.msg)
  if (r.code === 1) PAGES.decoration()
}
async function saveDecoration() {
  const navStyle = $('#nav_style') ? $('#nav_style').value : (decoCfg.nav_style || 'float_ellipse')
  const r = await biz('decoration/save', {
    name: decoCfg.name, colors: decoCfg.colors, bg_image: decoCfg.bg_image,
    page_bg_type: decoCfg.page_bg_type || 'solid',
    page_bg_from: decoCfg.page_bg_from || '#FFFFFF',
    page_bg_to: decoCfg.page_bg_to || '#FFFFFF',
    page_bg_deg: decoCfg.page_bg_deg || 180,
    nav_style: navStyle, floating_nav: decoCfg.floating_nav || []
  })
  toast(r.msg)
  if (r.code === 1) { decoDirty = false; renderDecoration() }
}

/* ============ 操作日志（yylAdmin 框架） ============ */
PAGES.logs = async () => {
  const r = await yyl('/admin/AdminLog/logList?page=1&limit=50')
  const list = (r.data && (r.data.list || r.data.data)) || []
  const rows = list.map(l => `<tr>
    <td>${esc(l.admin_log_id)}</td>
    <td>${esc(l.admin_user_id)}</td>
    <td>${esc(l.request_method)}</td>
    <td class="muted">${esc(l.request_ip)}</td>
    <td class="muted">${esc((l.request_param || '').slice(0, 60))}</td>
    <td class="muted">${esc(l.create_time || '')}</td></tr>`).join('')
  $('#content').innerHTML = `<div class="card">
    <div class="card-head"><h2>操作日志 <span class="muted">由 yylAdmin 框架记录</span></h2>
      <button class="btn btn-ghost btn-sm" onclick="PAGES.logs()">刷新</button></div>
    <table><thead><tr><th>ID</th><th>管理员</th><th>请求方式</th><th>IP</th><th>请求参数</th><th>时间</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6"><div class="empty">暂无日志</div></td></tr>'}</tbody></table></div>`
}

/* ============ 前端实时预览 ============ */
const DEVICES = [
  ['iPhone', 375, 812], ['iPhone Plus', 414, 896], ['Android', 360, 800], ['iPad', 768, 1024], ['全屏', 0, 0]
]
let pvDevice = 0, pvScale = 1
PAGES.preview = () => {
  const dev = DEVICES[pvDevice]
  const isFull = dev[0] === '全屏'
  $('#content').innerHTML = `
    <div class="preview-toolbar">
      <input class="pv-url" value="/h5/" readonly>
      <button class="btn btn-ghost btn-sm" onclick="pvRefresh()">刷新</button>
      <button class="btn btn-primary btn-sm" onclick="window.open('/h5/','_blank')">新标签打开</button>
    </div>
    <div class="preview-toolbar">
      <span style="font-size:13px;color:#6b7280">设备尺寸：</span>
      <div class="dev-btns">${DEVICES.map((d, i) => `<button class="dev-btn ${i === pvDevice ? 'active' : ''}" onclick="pvSet(${i})">${d[0]}</button>`).join('')}</div>
    </div>
    <div class="phone-wrap"><div class="phone" style="${isFull ? 'width:100%;max-width:1100px;height:78vh;border-radius:14px' : 'width:' + dev[1] + 'px;height:' + dev[2] + 'px'}">
      ${isFull ? '' : '<div class="notch"></div>'}
      <iframe id="pvFrame" src="/h5/" style="${isFull ? 'border-radius:6px' : ''}"></iframe>
    </div></div>
    <div style="text-align:center;color:#9ca3af;font-size:13px;padding-bottom:20px">实时预览当前 H5 前端，与前台共用同一数据源，后台改动保存后即可在预览中生效</div>`
}
function pvSet(i) { pvDevice = i; PAGES.preview() }
function pvRefresh() { const f = $('#pvFrame'); if (f) f.src = f.src }

/* ============ 弹窗 ============ */
function openModal(title, body, buttons) {
  $('#modalTitle').textContent = title
  $('#modalBody').innerHTML = body
  $('#modalFoot').innerHTML = ''
  ;(buttons || []).forEach(b => {
    const el = document.createElement('button')
    el.className = 'btn ' + (b.cls || 'btn-ghost')
    el.textContent = b.text
    el.onclick = b.fn
    $('#modalFoot').appendChild(el)
  })
  $('#modal').classList.add('show')
}
function closeModal() { $('#modal').classList.remove('show') }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal() })

// 二次确认弹窗（替代原生 confirm）
function confirmModal(title, msg, onOk) {
  openModal(title, `<div style="font-size:14px;color:#374151;line-height:1.6;padding:6px 0">${esc(msg)}</div>`, [
    { text: '取消', cls: 'btn-ghost', fn: closeModal },
    { text: '确定', cls: 'btn-primary', fn: () => { closeModal(); onOk && onOk() } }
  ])
}

/* ============ 启动 ============ */
async function enterApp() {
  $('#login').style.display = 'none'
  $('#app').style.display = 'block'
  initSidebar()
  renderMenu()
  go('dashboard')
  try {
    const r = await yyl('/admin/AdminMy/myInfo?admin_user_id=' + state.uid)
    const info = (r.data && (r.data.admin_user || r.data)) || {}
    if (info.nickname) { $('#adminName').textContent = info.nickname; $('#adminAvatar').textContent = (info.nickname || 'A')[0] }
  } catch (e) { /* 忽略 */ }
}
;(function init() {
  const t = sessionStorage.getItem('admin_token'), u = sessionStorage.getItem('admin_uid')
  if (t) { state.token = t; state.uid = u; enterApp() }
})()
</script>
