<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-heading">
        <ul class="nav nav-tabs">
            <li class="active"><a href="#tab1" data-toggle="tab">头像框列表</a></li>
            <li><a href="#tab2" data-toggle="tab">分配头像框</a></li>
        </ul>
    </div>
    
    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <!-- 第一个标签页 - 完全标准 -->
            <div class="tab-pane fade active in" id="tab1">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}" ><i class="fa fa-refresh"></i> </a>
                        <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('avatarframe/add')?'':'hide'}" title="{:__('Add')}" ><i class="fa fa-plus"></i> {:__('Add')}</a>
                        <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('avatarframe/edit')?'':'hide'}" title="{:__('Edit')}" ><i class="fa fa-pencil"></i> {:__('Edit')}</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('avatarframe/del')?'':'hide'}" title="{:__('Delete')}" ><i class="fa fa-trash"></i> {:__('Delete')}</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('avatarframe/edit')}"
                           data-operate-del="{:$auth->check('avatarframe/del')}"
                           width="100%">
                    </table>
                </div>
            </div>
            
            <!-- 第二个标签页 - 分配头像框 -->
            <div class="tab-pane fade" id="tab2">
                <div class="widget-body no-padding">
                    <div id="thug-list-content">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
